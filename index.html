2Fstrong> possible avec les verbes <em>oser, pouvoir, cesser, savoir<\u002Fem> → \"je n'osais\" = \"je n'osais pas\". Suit un <strong>complément circonstanciel de cause/but<\u002Fstrong> \"dans la crainte de troubler son sommeil\" (groupe prépositionnel avec infinitif). »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 12 — André Breton, <em>Nadja<\u002Fem> (1928), incipit<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « André Breton (1896-1966) est le fondateur du <strong>surréalisme<\u002Fstrong>. <em>Nadja<\u002Fem> (1928), récit à mi-chemin entre roman et autobiographie, retrace sa rencontre avec une jeune femme mystérieuse. L'incipit s'ouvre sur une déambulation dans Paris. <strong>Nous nous demanderons comment Breton fait de la rencontre une expérience surréaliste qui transforme la réalité quotidienne en espace de merveilleux.<\u002Fstrong> Trois mouvements : la déambulation désœuvrée ; le surgissement de l'inconnue ; la description et le sourire énigmatique. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — l'errance désœuvrée<\u002Fstrong>\n- <strong>« l'un de ces après-midi tout à fait désœuvrés et très mornes, comme j'ai le secret d'en passer »<\u002Fstrong> → <strong>autodérision<\u002Fstrong> + ennui revendiqué : chez les surréalistes, l'ennui est une <strong>condition de la rencontre<\u002Fstrong>.\n- <strong>« la vitrine de la librairie de L'Humanité… le dernier ouvrage de Trotsky »<\u002Fstrong> → <strong>références politiques réelles<\u002Fstrong> : Breton, intellectuel <strong>engagé<\u002Fstrong>.\n- <strong>« sans but je poursuivais ma route »<\u002Fstrong> → <strong>errance volontaire<\u002Fstrong> : la \"dérive\" surréaliste, qui ouvre au <strong>hasard objectif<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : un cadre réaliste et oisif, propice à l'irruption du merveilleux.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — le surgissement de l'inconnue<\u002Fstrong>\n- <strong>« Tout à coup, alors qu'elle est peut-être encore à dix pas de moi »<\u002Fstrong> → <strong>adverbe de soudaineté<\u002Fstrong> + <strong>présent de narration<\u002Fstrong> : la rencontre est une <strong>irruption<\u002Fstrong>.\n- <strong>« une jeune femme très pauvrement vêtue, qui, elle aussi, me voit ou m'a vu »<\u002Fstrong> → <strong>réciprocité du regard<\u002Fstrong> : Nadja n'est pas passive.\n- <strong>« Elle va la tête haute, contrairement à tous les autres passants »<\u002Fstrong> → <strong>antithèse<\u002Fstrong> : elle se distingue de la foule.<\u002Fp>\n<blockquote>\n<p><em>Bilan : le banal bascule dans l'extraordinaire.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — la description énigmatique<\u002Fstrong>\n- <strong>« Si frêle qu'elle se pose à peine en marchant »<\u002Fstrong> → <strong>subordonnée de conséquence<\u002Fstrong> + image de <strong>légèreté irréelle<\u002Fstrong>.\n- <strong>« Curieusement fardée… le bord des yeux si noir pour une blonde »<\u002Fstrong> → <strong>détail troublant<\u002Fstrong> : le maquillage inachevé, le mystère.\n- <strong>« Je n'avais jamais vu de tels yeux »<\u002Fstrong> → <strong>hyperbole<\u002Fstrong> : la fascination.\n- <strong>« Elle sourit, mais très mystérieusement, et, dirai-je, comme en connaissance de cause »<\u002Fstrong> → <strong>sourire énigmatique<\u002Fstrong> : Nadja semble détenir un <strong>savoir<\u002Fstrong> caché.<\u002Fp>\n<blockquote>\n<p><em>Bilan : Nadja, figure du merveilleux quotidien, fascine et échappe.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> Breton ancre le récit dans le <strong>réel<\u002Fstrong> (date, lieux, références) pour mieux faire <strong>surgir l'extraordinaire<\u002Fstrong> : la rencontre devient une expérience surréaliste, où le hasard révèle un sens caché. <strong>Ouverture :<\u002Fstrong> cette fascination pour une femme en marge, énigmatique, dialogue avec <em>Manon Lescaut<\u002Fem> (la passion pour une figure insaisissable) — mais selon des codes opposés : le pathétique romanesque chez Prévost, le merveilleux surréaliste chez Breton. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« Si frêle qu'elle se pose à peine en marchant. »<\u002Fem>\n« <strong>Subordonnée circonstancielle de conséquence<\u002Fstrong>, introduite par le système corrélatif <strong>\"si… que\"<\u002Fstrong> : l'adverbe d'intensité \"si\" (portant sur l'adjectif \"frêle\") appelle la conséquence \"qu'elle se pose à peine en marchant\". À noter la <strong>forme atténuée<\u002Fstrong> \"à peine\" (proche de la négation) qui souligne l'irréelle légèreté. »<\u002Fp>\n<\u002Fblockquote>\n<h2>OBJET 4 · LITTÉRATURE D'IDÉES — <em>Discours de la servitude volontaire<\u002Fem> + La Fontaine<\u002Fh2>\n<h3>Parcours : « Défendre et entretenir la liberté »<\u002Fh3>\n<blockquote>\n<p>⭐ <strong>LA « FIN DES TEXTES »<\u002Fstrong> — c'est l'objet d'étude qui n'était pas dans le dossier du bac blanc. Quatre textes : <strong>trois extraits de La Boétie<\u002Fstrong> (13, 15, 16) et <strong>la fable complémentaire de La Fontaine<\u002Fstrong> (14). Soigne particulièrement les <strong>ponts<\u002Fstrong> entre eux : le <strong>Chien<\u002Fstrong> de La Fontaine <em>est<\u002Fem> la servitude volontaire de La Boétie.<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 13 — Étienne de La Boétie, <em>Discours de la servitude volontaire<\u002Fem> (1577) — l'exorde (la citation d'Ulysse)<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Étienne de La Boétie (1530-1563), magistrat et humaniste, ami de Montaigne, écrit le <em>Discours de la servitude volontaire<\u002Fem> tout jeune, vers dix-huit ans ; l'œuvre, publiée à titre posthume, deviendra un manifeste de la liberté. Cet extrait en est <strong>l'ouverture argumentative<\u002Fstrong> : partant d'un vers d'Homère, La Boétie y pose sa question révolutionnaire. <strong>Nous nous demanderons comment La Boétie installe, dès l'exorde, le paradoxe de la servitude volontaire.<\u002Fstrong> Trois mouvements : la citation d'Homère retournée (la critique d'un seul maître) ; le refus de débattre des régimes ; la proposition centrale, le paradoxe de la servitude. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — la citation d'Homère réfutée<\u002Fstrong>\n- <strong>« Qu'un, sans plus, soit le maître et qu'un seul soit le roi, / Voilà ce que disait Ulysse… selon Homère »<\u002Fstrong> → <strong>citation d'autorité<\u002Fstrong> (Homère/Ulysse) aussitôt <strong>retournée<\u002Fstrong> : posture critique humaniste, on ne s'incline pas devant l'autorité.\n- <strong>« la puissance d'un seul… est déjà dure et déraisonnable »<\u002Fstrong> → critique frontale : même <strong>un seul<\u002Fstrong> maître est illégitime ; <strong>adjectifs<\u002Fstrong> dépréciatifs.\n- <strong>« il tenait davantage un propos de circonstance que de vérité »<\u002Fstrong> → <strong>antithèse<\u002Fstrong> circonstance/vérité : La Boétie disqualifie l'argument d'Ulysse (un propos de guerre, pas une vérité).\n- <strong>« si l'on a plusieurs maîtres… être autant de fois extrêmement malheureux »<\u002Fstrong> → <strong>raisonnement logique<\u002Fstrong> + <strong>hyperbole<\u002Fstrong> : la pluralité de maîtres multiplie le malheur.<\u002Fp>\n<blockquote>\n<p><em>Bilan : par la critique d'une autorité prestigieuse, La Boétie établit que tout pouvoir d'un seul est un malheur.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — le refus de débattre des régimes (le recentrage)<\u002Fstrong>\n- <strong>« je ne veux pas… discuter… si les autres formes de république sont meilleures que la monarchie »<\u002Fstrong> → <strong>prétérition<\u002Fstrong> : il écarte le débat scolaire (monarchie vs républiques) pour aller à l'essentiel.\n- <strong>« on peine à croire qu'il y ait rien de public en ce gouvernement où tout revient à un seul »<\u002Fstrong> → <strong>jeu étymologique<\u002Fstrong> sur <em>res publica<\u002Fem> (la chose <strong>publique<\u002Fstrong>) : une tyrannie n'a rien de \"public\".<\u002Fp>\n<blockquote>\n<p><em>Bilan : La Boétie déplace la question : non pas « quel régime ? » mais « comment la servitude est-elle possible ? ».<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — la proposition centrale : le paradoxe de la servitude volontaire<\u002Fstrong>\n- <strong>« comment il peut arriver que tant d'hommes, tant de bourgs, tant de villes, tant de nations endurent… un tyran qui est seul »<\u002Fstrong> → <strong>gradation / accumulation anaphorique<\u002Fstrong> (\"tant de…\") : l'<strong>ampleur absurde<\u002Fstrong> de la soumission, du plus petit au plus grand.\n- <strong>« qui n'a d'autre puissance que celle qu'ils lui donnent ; qui n'a d'autre pouvoir… que celui qu'ils ont de pouvoir l'endurer »<\u002Fstrong> → <strong>parallélisme<\u002Fstrong> de relatives + <strong>paradoxe central<\u002Fstrong> : le tyran ne tient <strong>tout<\u002Fstrong> son pouvoir que du peuple lui-même.\n- <strong>« un million d'hommes servir misérablement, le cou sous le joug »<\u002Fstrong> → <strong>hyperbole<\u002Fstrong> + <strong>métaphore animale<\u002Fstrong> (« le cou sous le joug ») : le peuple, bête de somme.\n- <strong>« presque enchantés et charmés au nom d'un seul individu »<\u002Fstrong> → <strong>champ lexical de la magie<\u002Fstrong> : la servitude est un <strong>ensorcellement<\u002Fstrong> irrationnel.\n- <strong>« dont ils ne doivent ni craindre la puissance, puisqu'il est seul, ni aimer les qualités, puisqu'il est inhumain »<\u002Fstrong> → <strong>antithèse<\u002Fstrong> (ni craindre / ni aimer) + <strong>doubles subordonnées causales<\u002Fstrong> : aucune raison rationnelle de servir.<\u002Fp>\n<blockquote>\n<p><em>Bilan : l'exorde pose l'énigme qui commande tout le Discours — la servitude est volontaire, donc absurde.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> La Boétie installe le paradoxe en <strong>retournant une autorité<\u002Fstrong> (Homère), en <strong>écartant les faux débats<\u002Fstrong>, puis en <strong>formulant l'énigme<\u002Fstrong> : des millions d'hommes servent un seul homme qui n'a de pouvoir que celui qu'ils lui prêtent. Le champ lexical de l'ensorcellement dit l'irrationnel de cette soumission. <strong>Ouverture :<\u002Fstrong> cette servitude consentie se lit, transposée, dans la fable de La Fontaine (texte 14), où le Chien accepte la chaîne — mais aussi, au XX<sup>e<\u002Fsup> siècle, dans la \"souricière\" sociale de Sarraute (texte 8), où H2 entre lui-même dans la cage. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« un tyran… qui n'a d'autre puissance que celle qu'ils lui donnent »<\u002Fem>\n« On a ici <strong>deux propositions subordonnées relatives<\u002Fstrong> emboîtées. \"qui n'a d'autre puissance…\" est introduite par le pronom relatif <strong>\"qui\"<\u002Fstrong> (sujet), antécédent <strong>\"un tyran\"<\u002Fstrong>. À l'intérieur, \"qu'ils lui donnent\" est une seconde relative, introduite par le pronom relatif <strong>\"que\"<\u002Fstrong> (COD de \"donnent\"), antécédent <strong>\"celle\"<\u002Fstrong> (= la puissance). On peut aussi relever la tournure restrictive <strong>\"n'a d'autre… que\"<\u002Fstrong> (= il n'a pas d'autre puissance que celle-là). »<\u002Fp>\n<p>🔗 <strong>Pour le parcours<\u002Fstrong> : c'est ici qu'apparaît le mot du titre — <em>servitude<\u002Fem> + le paradoxe du <em>volontaire<\u002Fem>. À citer absolument : « il n'a d'autre puissance que celle qu'ils lui donnent ».<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 14 — Jean de La Fontaine, <em>Fables<\u002Fem> (1668), I, 5, « Le Loup et le Chien » <em>(texte complémentaire)<\u002Fem><\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Jean de La Fontaine (1621-1695), au siècle classique, fait de l'<strong>apologue<\u002Fstrong> — un récit plaisant porteur d'une leçon — une arme de réflexion (<em>placere et docere<\u002Fem>). \"Le Loup et le Chien\" (Fables, I, 5) met face à face un loup affamé mais libre et un chien gras mais domestiqué. <strong>Nous nous demanderons comment cette fable fait de la liberté un bien supérieur à tout confort.<\u002Fstrong> Trois mouvements : la rencontre et l'opposition des conditions (v. 1-9) ; la tentation de la servitude confortable (v. 10-26) ; la révélation du collier et le choix de la liberté (v. 27-fin). »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — v. 1-9 : la rencontre, deux conditions opposées<\u002Fstrong>\n- <strong>« Un Loup n'avait que les os et la peau »<\u002Fstrong> → <strong>hyperbole<\u002Fstrong> de la maigreur + <strong>restriction<\u002Fstrong> \"n'avait que\" : la liberté a un prix, la faim.\n- <strong>« un Dogue aussi puissant que beau, / Gras, poli »<\u002Fstrong> → <strong>accumulation méliorative<\u002Fstrong> : le chien incarne l'abondance et la santé.\n- <strong>« L'attaquer… Sire Loup l'eût fait volontiers. / Mais il fallait livrer bataille »<\u002Fstrong> → le rapport de force interdit l'attaque ; <strong>registre<\u002Fstrong> héroï-comique (\"Sire Loup\").\n- <strong>« Le Loup donc l'aborde humblement… lui fait compliment »<\u002Fstrong> → <strong>inversion comique<\u002Fstrong> : le prédateur <strong>flatte<\u002Fstrong> sa proie — premier signe que la faim humilie.<\u002Fp>\n<blockquote>\n<p><em>Bilan : face au chien prospère, le loup affamé est en position de faiblesse.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — v. 10-26 : la tentation de la servitude<\u002Fstrong>\n- <strong>« Il ne tiendra qu'à vous… D'être aussi gras que moi »<\u002Fstrong> → le chien fait <strong>miroiter<\u002Fstrong> le confort.\n- <strong>« Quittez les bois… Vos pareils y sont misérables, / Cancres, haires, et pauvres diables »<\u002Fstrong> → <strong>énumération dépréciative<\u002Fstrong> : la liberté est présentée comme misère.\n- <strong>« donner la chasse aux gens… Flatter ceux du logis, à son maître complaire »<\u002Fstrong> → <strong>énumération des tâches serviles<\u002Fstrong> : la servitude, c'est la <strong>flatterie<\u002Fstrong> et la perte de dignité (le chien chasse les pauvres pour le maître).\n- <strong>« votre salaire / Sera force reliefs… Os de poulets, os de pigeons »<\u002Fstrong> → la récompense <strong>matérielle<\u002Fstrong> des restes.\n- <strong>« Le Loup déjà se forge une félicité / Qui le fait pleurer de tendresse »<\u002Fstrong> → <strong>ironie<\u002Fstrong> + pathétique comique : le loup est <strong>presque séduit<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : la servitude est habilement vendue comme un bonheur facile — et le loup vacille.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — v. 27-fin : le collier et le sursaut de liberté<\u002Fstrong>\n- <strong>« il vit le col du Chien, pelé »<\u002Fstrong> → le <strong>détail révélateur<\u002Fstrong> : la marque du collier, trace cachée de la servitude.\n- <strong>« — Le collier dont je suis attaché… est peut-être la cause. »<\u002Fstrong> → l'<strong>aveu<\u002Fstrong> : le chien est <strong>attaché<\u002Fstrong>. La chaîne était invisible sous l'embonpoint.\n- <strong>« Attaché ? dit le Loup : vous ne courez donc pas / Où vous voulez ? »<\u002Fstrong> → <strong>question<\u002Fstrong> : pour le loup, la <strong>liberté de mouvement<\u002Fstrong> est la liberté même.\n- <strong>« Pas toujours, mais qu'importe ? »<\u002Fstrong> → le chien s'est <strong>accoutumé<\u002Fstrong> : il ne sent <strong>plus<\u002Fstrong> sa chaîne (exactement le mécanisme de l'<strong>habitude<\u002Fstrong> chez La Boétie, texte 15).\n- <strong>« Il importe si bien, que… / Je ne veux en aucune sorte… »<\u002Fstrong> → <strong>polyptote<\u002Fstrong> sur <em>importer<\u002Fem> (qu'importe / il importe) : le loup <strong>renverse<\u002Fstrong> l'argument.\n- <strong>« Cela dit, maître Loup s'enfuit, et court encor. »<\u002Fstrong> → <strong>chute<\u002Fstrong> au <strong>présent de vérité générale<\u002Fstrong> : la liberté reconquise est un <strong>mouvement perpétuel<\u002Fstrong> ; \"court encor\" = elle ne s'arrête jamais.<\u002Fp>\n<blockquote>\n<p><em>Bilan : devant le signe de la chaîne, le loup choisit la faim libre contre l'abondance servile.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> La Fontaine, par un apologue plaisant, fait de la <strong>liberté un bien sans prix<\u002Fstrong> — \"ne voudrais pas même à ce prix un trésor\". La <strong>morale est implicite<\u002Fstrong> : c'est au lecteur de conclure, ce qui rend la leçon plus efficace. <strong>Ouverture :<\u002Fstrong> le Chien gras et résigné illustre la <strong>servitude volontaire<\u002Fstrong> de La Boétie (le maître qui \"se pavane sous le harnais\", texte 15), tandis que le Loup est l'un de ces hommes \"mieux nés qui sentent le poids du joug et ne peuvent se retenir de le secouer\". La fable est le <strong>pont parfait<\u002Fstrong> du parcours \"Défendre et entretenir la liberté\". »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« Il importe si bien, que de tous vos repas / Je ne veux en aucune sorte. »<\u002Fem>\n« <strong>Subordonnée circonstancielle de conséquence<\u002Fstrong>, introduite par le système corrélatif <strong>\"si… que\"<\u002Fstrong> : l'adverbe d'intensité \"si\" (portant sur \"bien\") appelle la conséquence \"que… Je ne veux en aucune sorte\". La principale \"Il importe si bien\" commande la subordonnée. On relève en outre une <strong>négation<\u002Fstrong> : \"ne… en aucune sorte\" (négation <strong>totale<\u002Fstrong>, \"en aucune sorte\" valant pour \"pas du tout\"). »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 15 — Étienne de La Boétie, <em>Discours de la servitude volontaire<\u002Fem> (1577) — l'habitude et les « mieux nés »<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Après avoir posé son énigme, La Boétie en cherche les <strong>causes<\u002Fstrong>. Dans cet extrait, il désigne la première : <strong>l'habitude<\u002Fstrong>. <strong>Nous nous demanderons comment La Boétie explique la servitude par l'accoutumance, tout en désignant dans le savoir le moyen d'y résister.<\u002Fstrong> Trois mouvements : l'habitude, première raison de la servitude (avec l'image des chevaux) ; les \"mieux nés\" qui sentent le joug ; le pouvoir libérateur des livres et l'isolement des amants de la liberté. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — l'habitude, première cause<\u002Fstrong>\n- <strong>« sont naturelles à l'homme toutes les choses auxquelles il s'éduque et s'accoutume »<\u002Fstrong> → <strong>antithèse<\u002Fstrong> entre la \"nature simple et non altérée\" et l'habitude qui <strong>contrefait<\u002Fstrong> la nature.\n- <strong>« la première raison de la servitude volontaire, c'est l'habitude »<\u002Fstrong> → <strong>présentatif emphatique<\u002Fstrong> (\"c'est…\") : la thèse du passage, nettement détachée.\n- <strong>« les plus braves chevaux… au début mordent leur frein, puis s'en jouent… se pavanent sous l'armure »<\u002Fstrong> → <strong>analogie animale<\u002Fstrong> + <strong>métaphore filée<\u002Fstrong> du dressage : <strong>gradation<\u002Fstrong> de la révolte à la <strong>fierté<\u002Fstrong> d'être asservi. C'est l'image exacte du <strong>Chien<\u002Fstrong> de La Fontaine.\n- <strong>« les années ne donnent jamais le droit de mal faire, mais accroissent au contraire l'injustice »<\u002Fstrong> → <strong>maxime<\u002Fstrong> + <strong>antithèse<\u002Fstrong> : l'ancienneté ne <strong>légitime<\u002Fstrong> pas la tyrannie.<\u002Fp>\n<blockquote>\n<p><em>Bilan : on sert par habitude, et l'habitude finit par rendre fier de sa chaîne.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — les \"mieux nés\" qui résistent<\u002Fstrong>\n- <strong>« Il s'en trouve toujours quelques-uns, mieux nés que les autres, qui sentent le poids du joug »<\u002Fstrong> → <strong>comparatif<\u002Fstrong> (\"mieux nés\") + reprise de la <strong>métaphore du joug<\u002Fstrong> : une minorité <strong>lucide<\u002Fstrong>.\n- <strong>« comme Ulysse qui… n'avait de cesse de voir la fumée de sa maison »<\u002Fstrong> → <strong>exemplum<\u002Fstrong> homérique : la <strong>nostalgie de la patrie/liberté<\u002Fstrong>, le souvenir du \"premier état\".\n- <strong>« ne se contentent pas, comme la grossière populace, de voir ce qui est à leurs pieds… mais se remémorent le passé pour juger de l'avenir et mesurer le présent »<\u002Fstrong> → <strong>antithèse<\u002Fstrong> (les clairvoyants / la populace) + <strong>rythme ternaire<\u002Fstrong> passé/avenir/présent : la <strong>mémoire<\u002Fstrong> est la clé.\n- <strong>« l'ont encore perfectionnée par l'étude et le savoir »<\u002Fstrong> → cœur du parcours : la liberté <strong>s'entretient<\u002Fstrong> par la <strong>culture<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : seuls ceux qui cultivent la mémoire et le savoir gardent vivant l'amour de la liberté.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — les livres et l'isolement<\u002Fstrong>\n- <strong>« Le grand Turc a bien compris que les livres et la pensée donnent… aux hommes le sens… propices à… haïr la tyrannie »<\u002Fstrong> → <strong>exemplum politique<\u002Fstrong> : le tyran <strong>sait<\u002Fstrong> que le savoir libère — donc il l'étouffe (\"il a… peu de gens savants et n'en demande pas\").\n- <strong>« ils ne se fréquentent pas… la liberté de faire, de parler, quasiment de penser leur est enlevée »<\u002Fstrong> → <strong>gradation<\u002Fstrong> (faire / parler / penser) : la tyrannie <strong>isole<\u002Fstrong> les amoureux de la liberté.\n- <strong>« ils sont tout seuls en leurs rêves »<\u002Fstrong> → <strong>clausule mélancolique<\u002Fstrong> : la résistance individuelle reste impuissante sans communauté.<\u002Fp>\n<blockquote>\n<p><em>Bilan : les livres rendent libre — c'est pourquoi le tyran les craint et isole ceux qui les aiment.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> la servitude tient à l'<strong>habitude<\u002Fstrong>, qui transforme l'asservissement en seconde nature (les chevaux, le Chien) ; mais une élite \"mieux née\", nourrie d'<strong>étude<\u002Fstrong>, de <strong>mémoire<\u002Fstrong> et de <strong>savoir<\u002Fstrong>, sait que la liberté est naturelle et la <strong>savoure<\u002Fstrong> même perdue. <strong>Défendre et entretenir la liberté<\u002Fstrong> passe donc par la culture. <strong>Ouverture :<\u002Fstrong> cette foi humaniste dans les livres trouve un écho moderne dans toutes les dystopies de la censure (Bradbury, <em>Fahrenheit 451<\u002Fem>) où brûler les livres, c'est éteindre la liberté. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« Il s'en trouve toujours quelques-uns, mieux nés que les autres, qui sentent le poids du joug et ne peuvent se retenir de le secouer. »<\u002Fem>\n« On relève <strong>deux propositions subordonnées relatives coordonnées<\u002Fstrong> par \"et\", ayant le même antécédent <strong>\"quelques-uns\"<\u002Fstrong> et le même pronom relatif sujet <strong>\"qui\"<\u002Fstrong> (sous-entendu devant \"ne peuvent\") : \"qui sentent le poids du joug\" / \"(qui) ne peuvent se retenir de le secouer\". On peut aussi analyser <strong>\"mieux nés que les autres\"<\u002Fstrong> comme une <strong>proposition subordonnée comparative<\u002Fstrong> elliptique (système \"mieux… que\"), apposée à \"quelques-uns\". »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 16 — Étienne de La Boétie, <em>Discours de la servitude volontaire<\u002Fem> (1577) — les mythes du pouvoir et l'éloge de la Pléiade<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Dans cette <strong>digression<\u002Fstrong>, La Boétie aborde les <strong>légendes<\u002Fstrong> par lesquelles le pouvoir se sacralise (la Sainte Ampoule, l'oriflamme, les fleurs de lys), puis bifurque vers un <strong>éloge de la poésie française<\u002Fstrong> et de la Pléiade. Texte subtil, où l'humaniste mêle prudence politique et fierté culturelle. <strong>Nous nous demanderons comment La Boétie, en feignant d'accepter les mythes royaux, célèbre en réalité la liberté créatrice de la langue française.<\u002Fstrong> Trois mouvements : les mythes \"semés\" pour légitimer le pouvoir ; le refus ironique de débattre de l'histoire ; l'éloge de la Pléiade. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — les mythes royaux, des fictions \"semées\"<\u002Fstrong>\n- <strong>« Les nôtres semèrent je ne sais quoi de semblable, des crapauds, des fleurs de lys, l'ampoule et l'oriflamme »<\u002Fstrong> → <strong>métaphore agricole<\u002Fstrong> (\"semèrent\") : les mythes <strong>plantés<\u002Fstrong> dans les esprits, comme une propagande. <strong>Énumération hétéroclite<\u002Fstrong> mêlant le dérisoire (\"crapauds\") et le sacré (\"ampoule\") → <strong>ironie<\u002Fstrong> discrète.\n- <strong>« je veux bien y croire, puisque ni nous ni nos ancêtres n'avons eu… l'occasion de ne pas y croire »<\u002Fstrong> → <strong>prétérition / fausse adhésion<\u002Fstrong> : il dit \"y croire\" par une justification qui en signale l'arbitraire.\n- <strong>« choisis par Dieu tout-puissant, avant leur naissance »<\u002Fstrong> → <strong>champ lexical du droit divin<\u002Fstrong>, mis à distance par le modalisateur \"<strong>ils semblent<\u002Fstrong>\".<\u002Fp>\n<blockquote>\n<p><em>Bilan : sous l'apparente déférence, La Boétie désigne les mythes royaux comme des fictions utiles au pouvoir.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — le refus (prudent et ironique) de débattre<\u002Fstrong>\n- <strong>« je ne voudrais pas… entrer en lice pour débattre du fondement de notre histoire »<\u002Fstrong> → <strong>prétérition<\u002Fstrong> explicite + <strong>métaphore guerrière<\u002Fstrong> (\"entrer en lice\", \"s'escrimer\") : refuser le débat, c'est encore une façon de le <strong>signaler<\u002Fstrong>.\n- <strong>« afin de ne pas gâter ce beau sujet où pourra fort bien s'escrimer notre poésie française »<\u002Fstrong> → le glissement décisif : ces légendes relèvent désormais de la <strong>poésie<\u002Fstrong>, non de la <strong>vérité historique<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : La Boétie confie les mythes du pouvoir au domaine de l'art, manière habile de les neutraliser politiquement.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — l'éloge de la Pléiade et de la langue française<\u002Fstrong>\n- <strong>« notre Ronsard, notre Baïf, notre Du Bellay »<\u002Fstrong> → <strong>anaphore du possessif \"notre\"<\u002Fstrong> : <strong>appropriation collective et nationale<\u002Fstrong>, fierté humaniste.\n- <strong>« refaite toute à neuf… lui redonner ses lettres de noblesse et… sa gloire première »<\u002Fstrong> → <strong>champ lexical de la rénovation<\u002Fstrong> : allusion à la <em>Défense et illustration de la langue française<\u002Fem> (Du Bellay) — la langue vulgaire élevée à la dignité de l'art.\n- <strong>« ils font tant progresser notre langue que… les Grecs ni les Latins n'auront rien à nous envier… sinon… le droit d'aînesse »<\u002Fstrong> → <strong>subordonnée de conséquence<\u002Fstrong> + ambition d'<strong>égaler l'Antiquité<\u002Fstrong> : on ne lui concède que l'<strong>antériorité<\u002Fstrong>.\n- <strong>« il fera son affaire de l'oriflamme aussi bien que les Romains de leurs anciles… comme dit Virgile »<\u002Fstrong> → <strong>références érudites<\u002Fstrong> (Virgile, Érichtonios, Minerve) : tous les peuples ont leurs <strong>mythes fondateurs<\u002Fstrong>, la France aura les siens <strong>par sa poésie<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : la vraie grandeur n'est pas dans les mythes du pouvoir mais dans la liberté créatrice de la poésie nationale.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> en feignant d'accepter les légendes royales, La Boétie les <strong>dépolitise<\u002Fstrong> (ce sont des fictions) et les <strong>réinvestit<\u002Fstrong> dans la poésie ; son véritable enthousiasme va à la <strong>Pléiade<\u002Fstrong> et au renouveau de la <strong>langue française<\u002Fstrong>, manifestation éclatante de <strong>liberté<\u002Fstrong>. <strong>Défendre la liberté<\u002Fstrong>, c'est aussi démasquer les fictions du pouvoir ; <strong>l'entretenir<\u002Fstrong>, c'est cultiver les lettres. <strong>Ouverture :<\u002Fstrong> cette fierté pour la langue nationale comme espace de liberté résonne avec l'ambition de la Renaissance tout entière, et plus loin avec l'idée moderne que la culture est un rempart contre la tyrannie (texte 15, les \"livres\" que craint le Grand Turc). »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« ils font tant progresser notre langue que j'ose espérer que bientôt les Grecs ni les Latins n'auront rien à nous envier. »<\u002Fem>\n« <strong>Subordonnée circonstancielle de conséquence<\u002Fstrong>, introduite par le corrélatif <strong>\"tant… que\"<\u002Fstrong> : l'adverbe d'intensité \"tant\" appelle la conséquence \"que j'ose espérer…\". À l'intérieur, \"que… les Grecs ni les Latins n'auront rien à nous envier\" est une <strong>subordonnée complétive<\u002Fstrong> (COD de \"espérer\"), elle-même de <strong>forme négative<\u002Fstrong> : la négation \"ne… rien\" est renforcée par la coordination négative <strong>\"ni… (ni)\"<\u002Fstrong> portant sur le sujet. »<\u002Fp>\n<p>🔗 <strong>Pour le parcours<\u002Fstrong> : ce texte montre les <strong>deux faces<\u002Fstrong> de la liberté chez La Boétie — <em>démasquer<\u002Fem> les fictions qui asservissent (les mythes royaux \"semés\") et <em>cultiver<\u002Fem> ce qui libère (la poésie, la langue). À relier au texte 15 (les livres) et au divertissement des Lydiens évoqué ailleurs dans l'œuvre.<\u002Fp>\n<\u002Fblockquote>\n<h1>PARTIE 4 — L'ENTRETIEN (8 points)<\u002Fh1>\n<blockquote>\n<p><strong>Rappel<\u002Fstrong> : tu présentes <strong>librement (2 min)<\u002Fstrong> l'œuvre que tu as choisie, puis l'examinateur <strong>dialogue<\u002Fstrong> avec toi (6 min). Ton œuvre choisie ici est <strong><em>Art<\u002Fem> de Yasmina Reza<\u002Fstrong> (lecture cursive du parcours \"Théâtre et dispute\"). Tu peux aussi, si tu préfères, présenter l'une des <strong>4 œuvres au programme<\u002Fstrong> : tu trouveras un mini-canevas pour chacune à la fin de cette partie.<\u002Fp>\n<\u002Fblockquote>\n<h2>A. Présentation libre de <em>Art<\u002Fem> — à apprendre (≈ 2 min, structure QUOI / POURQUOI MOI / LIENS)<\u002Fh2>\n<blockquote>\n<p>« J'ai choisi pour mon entretien la pièce <em>Art<\u002Fem>, de <strong>Yasmina Reza<\u002Fstrong>, publiée en <strong>1994<\u002Fstrong>. C'est une <strong>comédie dramatique<\u002Fstrong> en un acte qui met en scène trois amis de longue date : <strong>Marc, Serge et Yvan<\u002Fstrong>. Le déclencheur est l'achat, par Serge, d'un tableau <strong>entièrement blanc<\u002Fstrong> — un <em>Antrios<\u002Fem> — pour deux cent mille francs. Pour Marc, c'est une \"merde\" et une trahison ; pour Serge, une œuvre majeure ; Yvan tente de faire le tampon. En quelques scènes, cette dispute esthétique fait remonter <strong>vingt ans de tensions<\u002Fstrong>. La pièce se termine par un geste absurde et bouleversant : Marc dessine un petit <strong>skieur<\u002Fstrong> au feutre sur le tableau, puis ils le nettoient ensemble.<\u002Fp>\n<p>Je l'ai choisie pour <strong>trois raisons<\u002Fstrong>. D'abord parce qu'elle pose une question qui me touche : <strong>qu'est-ce qui fait tenir une amitié<\u002Fstrong>, et que se passe-t-il quand le langage devient une arme entre amis ? Ensuite parce qu'elle m'a fait <strong>rire et mettre mal à l'aise<\u002Fstrong> en même temps — ce que j'attends d'un grand texte de théâtre. Enfin parce qu'elle entre en <strong>résonance forte<\u002Fstrong> avec <em>Pour un oui ou pour un non<\u002Fem> de Sarraute, où une amitié se brise aussi sur une parole minuscule.<\u002Fp>\n<p>Dans l'entretien, je serai prête à parler des <strong>personnages<\u002Fstrong>, du rôle du <strong>tableau comme révélateur<\u002Fstrong>, et de ce que signifie le titre, <em>Art<\u002Fem>, <strong>mis entre guillemets<\u002Fstrong>. »<\u002Fp>\n<\u002Fblockquote>\n<h2>B. Résumé de la pièce (à connaître)<\u002Fh2>\n<ul>\n<li><strong>Forme<\u002Fstrong> : pas d'actes classiques ; des séquences fluides alternant <strong>dialogues<\u002Fstrong> et <strong>monologues d'adresse au public<\u002Fstrong>. Trois personnages, décor minimal, le tableau blanc au centre.<\u002Fli>\n<li><strong>Déclencheur<\u002Fstrong> : Serge montre à Marc son <em>Antrios<\u002Fem> blanc (200 000 F). Marc : « cette <strong>merde<\u002Fstrong> » (p. 17).<\u002Fli>\n<li><strong>Montée<\u002Fstrong> : Marc va se moquer avec Yvan, qui refuse de prendre parti (« Moi je fais ce que vous voulez », p. 49). Les trois se retrouvent : le débat sur l'art dégénère en <strong>règlement de comptes<\u002Fstrong>. Yvan, bouc émissaire, <strong>craque<\u002Fstrong> (lecture des notes de son psy, p. 58). Bref <strong>glissement vers la violence<\u002Fstrong> physique.<\u002Fli>\n<li><strong>Dénouement<\u002Fstrong> : Serge tend un feutre à Marc, qui dessine un <strong>skieur<\u002Fstrong> sur le tableau (en réalité protégé par un vernis : ça s'efface). Réconciliation : ils sont en <strong>« période d'essai »<\u002Fstrong>.<\u002Fli>\n<li><strong>Monologue final<\u002Fstrong> de Marc : « Sous les nuages blancs, la neige tombe… Un homme seul, à skis, glisse. » (p. 81) → <strong>réconciliation par la fiction partagée<\u002Fstrong>.<\u002Fli>\n<\u002Ful>\n<h2>C. Les personnages<\u002Fh2>\n<ul>\n<li><strong>MARC<\u002Fstrong> — la cinquantaine, ingénieur aéronautique. <strong>Rationaliste indigné<\u002Fstrong>, classique, possessif en amitié : il a \"fabriqué\" Serge à son image. <em>« La surprise est une chose morte. »<\u002Fem> (p. 72)<\u002Fli>\n<li><strong>SERGE<\u002Fstrong> — dermatologue, cultivé, <strong>snob mais sincère<\u002Fstrong>, veut être \"de son temps\". Utilise le jargon (« déconstruction ») comme élévation sociale. A besoin de l'<strong>approbation<\u002Fstrong> de Marc.<\u002Fli>\n<li><strong>YVAN<\u002Fstrong> — vendeur en papeterie, <strong>médiateur<\u002Fstrong> et bouc émissaire. Refuse de choisir → méprisé par les deux autres. Anxieux, débordé par son mariage.<\u002Fli>\n<\u002Ful>\n<h2>D. Les 5 thèmes<\u002Fh2>\n<ol>\n<li><strong>L'amitié et sa fragilité<\u002Fstrong> : vingt ans peuvent vaciller sur un tableau blanc ; l'amitié est un <strong>équilibre construit<\u002Fstrong>, fait de silences et de goûts partagés.<\u002Fli>\n<li><strong>L'art contemporain comme miroir<\u002Fstrong> : le tableau <strong>vide<\u002Fstrong> force chacun à y projeter son angoisse → <strong>révélateur<\u002Fstrong> des personnalités. D'où le titre entre guillemets : <em>qu'est-ce que l'art ?<\u002Fem><\u002Fli>\n<li><strong>Le langage comme arme<\u002Fstrong> : on passe de l'esthétique à l'attaque personnelle ; l'honnêteté brutale devient destructrice. <em>(Lien fort avec Sarraute.)<\u002Fem><\u002Fli>\n<li><strong>L'identité et le besoin de reconnaissance<\u002Fstrong> : chacun a besoin du regard des autres pour exister.<\u002Fli>\n<li><strong>La fiction salvatrice<\u002Fstrong> : l'amitié se sauve par un <strong>mensonge poétique partagé<\u002Fstrong> (le skieur sous la neige).<\u002Fli>\n<\u002Fol>\n<h2>E. Questions probables + réponses prêtes<\u002Fh2>\n<ul>\n<li><strong>« Pourquoi cette œuvre ? »<\u002Fstrong> → une dispute futile (un tableau blanc) qui révèle des fractures profondes ; pièce courte, drôle, à plusieurs niveaux de lecture.<\u002Fli>\n<li><strong>« Pourquoi le titre entre guillemets ? »<\u002Fstrong> → mise à distance : <em>qu'est-ce que l'art ?<\u002Fem> (le tableau ? le geste du skieur ? la fiction acceptée ?). Question laissée <strong>ouverte<\u002Fstrong>.<\u002Fli>\n<li><strong>« Que représente le tableau blanc ? »<\u002Fstrong> → un <strong>miroir/écran<\u002Fstrong> : il ne montre rien, donc révèle chacun ; métaphore du <strong>langage<\u002Fstrong> (surface blanche que chacun remplit).<\u002Fli>\n<li><strong>« Quel personnage vous touche ? »<\u002Fstrong> → <em>(au choix, défendable)<\u002Fem> Yvan (le conciliateur puni), Serge (l'élévation méprisée), ou Marc (le brutal qui invente la fiction qui sauve).<\u002Fli>\n<li><strong>« En quoi est-ce une comédie ? »<\u002Fstrong> → <strong>comédie dramatique<\u002Fstrong> : comique de situation/mots/caractère, mais le rire est inséparable du malaise. Lignée Molière → Sarraute → Reza.<\u002Fli>\n<li><strong>« Quels liens avec le parcours ? »<\u002Fstrong> → avec <strong>Molière<\u002Fstrong> (Alceste/Marc, le refus du compromis) ; avec <strong>Sarraute<\u002Fstrong> (l'amitié brisée sur une parole, mais Reza imagine une réconciliation). Plus largement, l'amitié comme tension <strong>fusion/autonomie<\u002Fstrong>.<\u002Fli>\n<li><strong>« Que pensez-vous de la fin ? »<\u002Fstrong> → <strong>ambiguë<\u002Fstrong> : happy end <em>et<\u002Fem> réconciliation fragile (\"période d'essai\") ; l'amitié survit à condition de partager une fiction. Une fin <strong>lucide<\u002Fstrong>, \"comme la vie\".<\u002Fli>\n<li><strong>« Yasmina Reza ? »<\u002Fstrong> → née en 1959 à Paris ; ancienne comédienne ; <em>Art<\u002Fem> (Molière 1995, jouée dans le monde entier) ; aussi <em>Le Dieu du carnage<\u002Fem> (2007). Autrice des <strong>vernis sociaux<\u002Fstrong> et de ce qu'ils cachent.<\u002Fli>\n<\u002Ful>\n<h2>F. SI TU PRÉFÈRES PRÉSENTER UNE ŒUVRE AU PROGRAMME<\u002Fh2>\n<blockquote>\n<p>Canevas de 2 minutes — même structure <strong>QUOI / POURQUOI MOI / LIENS<\u002Fstrong>. Choisis celle que tu maîtrises le mieux.<\u002Fp>\n<\u002Fblockquote>\n<h3><em>Mes Forêts<\u002Fem> — Hélène Dorion (poésie)<\u002Fh3>\n<ul>\n<li><strong>QUOI<\u002Fstrong> : recueil de 2021 ; la forêt comme métaphore de l'intime, du temps, du chaos du monde ; une autrice <strong>vivante<\u002Fstrong>, québécoise.<\u002Fli>\n<li><strong>POURQUOI MOI<\u002Fstrong> : la poésie qui parle de notre époque (crises, écrans, écologie) ; la forêt comme refuge intérieur ; « de l'autre côté de la nuit ».<\u002Fli>\n<li><strong>LIENS<\u002Fstrong> : Jammes (texte 1, la nature spiritualisée) ; Baudelaire (« Correspondances ») ; Thoreau (<em>Walden<\u002Fem>).<\u002Fli>\n<\u002Ful>\n<h3><em>Pour un oui ou pour un non<\u002Fem> — Nathalie Sarraute (théâtre)<\u002Fh3>\n<ul>\n<li><strong>QUOI<\u002Fstrong> : pièce de 1982 ; deux amis (H1, H2) dont l'amitié se brise sur une parole minuscule ; les <strong>tropismes<\u002Fstrong>.<\u002Fli>\n<li><strong>POURQUOI MOI<\u002Fstrong> : montrer que les disputes naissent de <strong>ce qui ne peut pas se dire<\u002Fstrong> ; l'indicible, les silences, les aposiopèses.<\u002Fli>\n<li><strong>LIENS<\u002Fstrong> : Molière, <em>Le Misanthrope<\u002Fem> (texte 6) ; <em>Art<\u002Fem> de Reza (même sujet, autre dénouement).<\u002Fli>\n<\u002Ful>\n<h3><em>Manon Lescaut<\u002Fem> — Abbé Prévost (roman)<\u002Fh3>\n<ul>\n<li><strong>QUOI<\u002Fstrong> : roman de 1731 ; la passion de Des Grieux pour Manon le précipite dans la marge (prison, meurtre, déportation, mort).<\u002Fli>\n<li><strong>POURQUOI MOI<\u002Fstrong> : un <strong>anti-héros<\u002Fstrong> fascinant ; l'ambiguïté morale (Prévost prétend instruire en fascinant par le vice) ; le pathétique de la fin.<\u002Fli>\n<li><strong>LIENS<\u002Fstrong> : « Avis de l'auteur » (texte 9, \"traité de morale réduit agréablement en exercices\") ; Breton, <em>Nadja<\u002Fem> (la femme insaisissable).<\u002Fli>\n<\u002Ful>\n<h3><em>Discours de la servitude volontaire<\u002Fem> — La Boétie (littérature d'idées)<\u002Fh3>\n<ul>\n<li><strong>QUOI<\u002Fstrong> : écrit vers 1548, publié en 1577 ; <strong>thèse révolutionnaire<\u002Fstrong> : la tyrannie tient par le <strong>consentement<\u002Fstrong> du peuple, pas par la force ; il suffit de cesser de servir.<\u002Fli>\n<li><strong>POURQUOI MOI<\u002Fstrong> : un texte écrit à 18 ans, <strong>toujours d'actualité<\u002Fstrong> (désobéissance civile, manipulation, divertissement) ; l'idée que la <strong>liberté s'entretient par la culture<\u002Fstrong>.<\u002Fli>\n<li><strong>LIENS<\u002Fstrong> : La Fontaine, « Le Loup et le Chien » (texte 14, le Chien = servitude volontaire) ; la \"souricière\" de Sarraute (texte 8) ; les dystopies modernes de la censure.<\u002Fli>\n<\u002Ful>\n<h1>PARTIE 5 — FICHES FLASH, PLAN DE RÉVISION &amp; ANTI-STRESS<\u002Fh1>\n<h2>A. Fiches flash des 16 textes (à relire le matin)<\u002Fh2>\n<blockquote>\n<p>Format : <strong>idée-force<\u002Fstrong> · mouvements · 3-4 procédés-clés · ouverture.<\u002Fp>\n<\u002Fblockquote>\n<p><strong>T1 — Jammes, « Élégies » IV<\u002Fstrong> · Désespoir → résignation douce → foi forestière. · 3 mvts : v.1-7 fusion / v.8-16 renaissance / v.17-26 vers Dieu. · <em>Procédés<\u002Fem> : négation « ne… plus rien » / comparaison « comme la courbe des collines » / oxymore « chaleur glacée » / anaphore « peut-être ». · <em>Ouv.<\u002Fem> : Dorion.<\u002Fp>\n<p><strong>T2 — Dorion, « L'aile »<\u002Fstrong> · Élan brisé → méditation poétique. · 2 mvts : v.1-6 oiseau tragique / v.7-14 intériorisation. · <em>Procédés<\u002Fem> : métonymie de l'aile / enjambement « retombe » / mise en abyme « à l'intérieur du poème » / leitmotiv « de l'autre côté de la nuit ». · <em>Ouv.<\u002Fem> : mythe d'Icare ; Baudelaire.<\u002Fp>\n<p><strong>T3 — Dorion, « Il fait un temps de foudre… »<\u002Fstrong> · Crise du monde = crise du langage = repli dans la forêt. · 3 mvts : v.1-8 ruines / v.9-17 actualité / v.18-22 refuge. · <em>Procédés<\u002Fem> : polysémie « temps » / asyndète « guerres famines » / acronymes « pib nip fmi » / synesthésie « bruit secret ». · <em>Ouv.<\u002Fem> : <em>Walden<\u002Fem>, <em>Into the Wild<\u002Fem>.<\u002Fp>\n<p><strong>T4 — Dorion, « Avant la nuit »<\u002Fstrong> · La poésie, chemin lumineux qui donne sens à l'humanité. · 3 mvts : convocation des poètes / cheminement / mission infinie. · <em>Procédés<\u002Fem> : intertextualité (Rilke, Dante…) / métaphore de la branche / personnification « nous dit l'arbre » / maxime « le temps jamais ne s'arrête ». · <em>Ouv.<\u002Fem> : Ponge, Bonnefoy.<\u002Fp>\n<p><strong>T5 — Sarraute, incipit<\u002Fstrong> · La crise installée sur un non-dit. · 3 mvts : <em>in medias res<\u002Fem> / détour par le passé / approche du nœud. · <em>Procédés<\u002Fem> : impératif « Écoute » / aposiopèses / interrogation directe vs indirecte / chute « rien qu'on puisse dire ». · <em>Gram.<\u002Fem> : interrogation directe/indirecte.<\u002Fp>\n<p><strong>T6 — Molière, <em>Le Misanthrope<\u002Fem><\u002Fstrong> · Exigence morale (Alceste) vs bienséance (Philinte). · 3 mvts : rupture / tirade morale / ironie de Philinte. · <em>Procédés<\u002Fem> : alexandrins, rimes plates / « Rayez cela de vos papiers » / juron « Morbleu » / hyperbole « me pendre ». · <em>Gram.<\u002Fem> : « ne… point » ; emphase « moi, je ».<\u002Fp>\n<p><strong>T7 — Sarraute, « Oui, il me semble… »<\u002Fstrong> · Rupture envisagée mais empêchée par le « surmoi social ». · 4 mvts : incompatibilité / idée de rupture / surmoi social / chute. · <em>Procédés<\u002Fem> : métaphores « sables mouvants » vs « claustrophobie » / question rhétorique / discours rapporté des « gens » / « Oui. Non ! ». · <em>Gram.<\u002Fem> : interrogation rhétorique / infinitive.<\u002Fp>\n<p><strong>T8 — Sarraute, « Non, ne riez pas » (souricière)<\u002Fstrong> · L'aliénation sociale consentie. · 3 mvts : récit de la souricière / humiliation / incompréhension. · <em>Procédés<\u002Fem> : métaphore filée cage/appât / « C'est biiien… ça » / didascalie « long silence ». · <em>Ouv.<\u002Fem> : <strong>La Boétie<\u002Fstrong> (servitude volontaire) !<\u002Fp>\n<p><strong>T9 — Prévost, « Avis de l'auteur »<\u002Fstrong> · Le roman, école de morale par l'exemple. · 2 mvts : paradoxe moral / l'exemple compense l'abstraction. · <em>Procédés<\u002Fem> : antithèse « estimés et négligés » / questions rhétoriques / métaphore de la lumière / « traité de morale réduit agréablement en exercices ». · <em>Gram.<\u002Fem> : restrictive « ne… que ».<\u002Fp>\n<p><strong>T10 — Prévost, évasion de Saint-Lazare<\u002Fstrong> · Des Grieux bascule dans la marge par un meurtre froid. · 3 mvts : prise d'otage / fuite / meurtre et ironie. · <em>Procédés<\u002Fem> : euphémisme « honnête raison de silence » / passé simple sec « je lui lâchai le coup » / transfert « C'est votre faute ». · <em>Gram.<\u002Fem> : « ne… point ».<\u002Fp>\n<p><strong>T11 — Prévost, mort de Manon<\u002Fstrong> · L'indicible du deuil ; survivre = être puni. · 3 mvts : récit impossible / ellipse de la mort / survie-punition. · <em>Procédés<\u002Fem> : apostrophe « Pardonnez… » / ellipse « Je la perdis » / antithèse « marques d'amour »/« expirait » / « ne » seul. · <em>Gram.<\u002Fem> : négation littéraire « je n'osais… ».<\u002Fp>\n<p><strong>T12 — Breton, <em>Nadja<\u002Fem>, incipit<\u002Fstrong> · Une rencontre banale transformée en merveilleux surréaliste. · 3 mvts : errance / surgissement / description énigmatique. · <em>Procédés<\u002Fem> : datation « 4 octobre » / « Tout à coup » / regard inversé / sourire mystérieux. · <em>Gram.<\u002Fem> : conséquence « si… que » / relative.<\u002Fp>\n<blockquote>\n<h3>⚡ Les 4 fiches de la « fin des textes »<\u002Fh3>\n<\u002Fblockquote>\n<p><strong>T13 — La Boétie, exorde (Ulysse)<\u002Fstrong> · Le paradoxe : le tyran n'a que le pouvoir qu'on lui donne. · 3 mvts : Homère réfuté / refus des faux débats / proposition centrale. · <em>Procédés<\u002Fem> : gradation « tant d'hommes, tant de bourgs… » / parallélisme des relatives / métaphore « le cou sous le joug » / champ lexical de la magie « enchantés et charmés ». · <em>Ouv.<\u002Fem> : La Fontaine (T14) ; Sarraute (T8). · <em>Gram.<\u002Fem> : subordonnées relatives.<\u002Fp>\n<p><strong>T14 — La Fontaine, « Le Loup et le Chien »<\u002Fstrong> · La liberté vaut mieux que tout confort. · 3 mvts : rencontre / tentation / collier et choix. · <em>Procédés<\u002Fem> : apologue, morale <strong>implicite<\u002Fstrong> / antithèse maigre/gras / énumération des tâches serviles / chute « s'enfuit, et court encor ». · <em>Ouv.<\u002Fem> : La Boétie (le Chien = servitude volontaire). · <em>Gram.<\u002Fem> : conséquence « si… que ».<\u002Fp>\n<p><strong>T15 — La Boétie, l'habitude<\u002Fstrong> · On sert par accoutumance ; le savoir libère. · 3 mvts : l'habitude (les chevaux) / les « mieux nés » (Ulysse) / les livres (le Grand Turc). · <em>Procédés<\u002Fem> : présentatif « c'est l'habitude » / métaphore filée du dressage / antithèse clairvoyants/populace / champ lexical de l'étude. · <em>Ouv.<\u002Fem> : <em>Fahrenheit 451<\u002Fem>. · <em>Gram.<\u002Fem> : relatives « qui sentent… ».<\u002Fp>\n<p><strong>T16 — La Boétie, mythes &amp; Pléiade<\u002Fstrong> · Démasquer les fictions du pouvoir, cultiver la liberté des lettres. · 3 mvts : mythes « semés » / refus ironique de débattre / éloge de la Pléiade. · <em>Procédés<\u002Fem> : métaphore « semèrent » / énumération « crapauds, fleurs de lys, ampoule, oriflamme » / prétérition / anaphore « notre Ronsard, notre Baïf… ». · <em>Ouv.<\u002Fem> : la culture, rempart contre la tyrannie (T15). · <em>Gram.<\u002Fem> : conséquence « tant… que ».<\u002Fp>\n<h2>B. Plan de révision (les 4 objets — la veille)<\u002Fh2>\n<table>\n<thead>\n<tr>\n<th>Bloc<\u002Fth>\n<th>Contenu<\u002Fth>\n<\u002Ftr>\n<\u002Fthead>\n<tbody>\n<tr>\n<td><strong>Bloc 1 — POÉSIE<\u002Fstrong><\u002Ftd>\n<td>Textes 1·2·3·4 (Jammes + Dorion ×3) — <strong>lire les poèmes à voix haute<\u002Fstrong><\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><em>Pause<\u002Fem><\u002Ftd>\n<td>manger, marcher 10 min<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><strong>Bloc 2 — THÉÂTRE<\u002Fstrong><\u002Ftd>\n<td>Textes 5·6·7·8 (Sarraute ×3 + Molière) — <strong>jouer les répliques<\u002Fstrong><\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><em>Pause courte<\u002Fem><\u002Ftd>\n<td><\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><strong>Bloc 3 — ROMAN<\u002Fstrong><\u002Ftd>\n<td>Textes 9·10·11·12 (Prévost ×3 + Breton)<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><em>Pause courte<\u002Fem><\u002Ftd>\n<td><\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><strong>Bloc 4 — IDÉES<\u002Fstrong> ⭐<\u002Ftd>\n<td>Textes 13·14·15·16 (La Boétie ×3 + La Fontaine) — <strong>le plus récent, à sécuriser<\u002Fstrong><\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><strong>Œuvre<\u002Fstrong><\u002Ftd>\n<td><em>Art<\u002Fem> : présentation libre + 5 citations clés<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><strong>DORMIR<\u002Fstrong><\u002Ftd>\n<td>non négociable — le sommeil consolide la mémoire<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><strong>Matin<\u002Fstrong><\u002Ftd>\n<td>relecture des <strong>fiches flash<\u002Fstrong> (5 min × 16) + présentation de <em>Art<\u002Fem><\u002Ftd>\n<\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<h2>C. Apprendre efficacement — la méthode des 3 passages (par texte)<\u002Fh2>\n<ol>\n<li><strong>Compréhension (10 min)<\u002Fstrong> : lis l'intro + les mouvements + les procédés. Tu <strong>comprends<\u002Fstrong>, tu n'apprends rien.<\u002Fli>\n<li><strong>Repérage (10 min)<\u002Fstrong> : choisis <strong>TOI-MÊME<\u002Fstrong> les 5 procédés les plus marquants (ceux que tu retiendras).<\u002Fli>\n<li><strong>Récitation active (5 min)<\u002Fstrong> : document fermé, dis <strong>à voix haute<\u002Fstrong> les 3 mouvements, 5 citations + procédé, la conclusion. Si tu butes, tu rouvres, tu recommences.<\u002Fli>\n<\u002Fol>\n<blockquote>\n<p><strong>Règle d'or<\u002Fstrong> : tu retiens mieux ce que tu <strong>crées<\u002Fstrong> que ce que tu <strong>lis<\u002Fstrong>. Pour chaque texte, invente <strong>une phrase à toi<\u002Fstrong> qui le résume (« La Boétie, c'est : le tyran n'a que le pouvoir qu'on lui prête »). Une phrase à toi = mémoire solide. <strong>L'oral se révise à voix haute.<\u002Fstrong><\u002Fp>\n<\u002Fblockquote>\n<h2>D. Anti-stress (le jour J)<\u002Fh2>\n<p><strong>Avant<\u002Fstrong> : petit-déjeuner suffisant (pain + œuf + fruit + eau) ; arrive 30 min en avance ; <strong>ne révise plus<\u002Fstrong> dans les 30 dernières minutes.\n<strong>Pendant la préparation (30 min)<\u002Fstrong> : lis le texte 2 fois (survol puis lentement) ; repère les mouvements au crayon ; liste les procédés en marge ; rédige ton <strong>intro complète<\u002Fstrong> (tu pourras la lire) ; prépare la <strong>conclusion<\u002Fstrong> en 2 phrases ; pour la grammaire : type → fonction → justification.\n<strong>Pendant l'oral<\u002Fstrong> : respire avant de parler ; regarde l'examinateur ; si tu trébuches : pause, respire, reprends — <strong>ne t'excuse pas<\u002Fstrong> ; voix un peu plus forte que naturel ; pour la lecture, <strong>ralentis<\u002Fstrong>.\n<strong>Si tu sèches en entretien<\u002Fstrong> : « Je n'avais pas réfléchi à cette question, mais je dirais que… » + une <strong>hypothèse<\u002Fstrong>. Toujours proposer quelque chose.<\u002Fp>\n<h2>E. Ce qu'il faut absolument ÉVITER<\u002Fh2>\n<ul>\n<li>❌ Dire « je ne sais pas » sans rien proposer.<\u002Fli>\n<li>❌ <strong>Paraphraser<\u002Fstrong> le texte → toujours <strong>citer + nommer le procédé + expliquer l'effet<\u002Fstrong>.<\u002Fli>\n<li>❌ Réciter ton plan d'un coup → fais une vraie analyse <strong>lente<\u002Fstrong>, ligne par ligne.<\u002Fli>\n<li>❌ Oublier l'<strong>ouverture<\u002Fstrong> en conclusion.<\u002Fli>\n<li>❌ Multiplier les « euh » → préfère un <strong>silence court<\u002Fstrong>.<\u002Fli>\n<li>❌ Regarder ta montre.<\u002Fli>\n<\u002Ful>\n<blockquote>\n<h3>MOT FINAL<\u002Fh3>\n<p>Tu as un <strong>dossier complet<\u002Fstrong> entre les mains — <strong>les 16 textes<\u002Fstrong>, y compris la littérature d'idées qui manquait. Demain : tu lis ton texte, tu fais ton explication, tu réponds à la grammaire, tu présentes <em>Art<\u002Fem>, tu discutes. Aucune étape n'est insurmontable. <strong>Tu en as les outils. Tu vas y arriver.<\u002Fstrong> Vise le 20.<\u002Fp>\n<p><em>Mantras<\u002Fem> : « J'ai préparé, mes connaissances sont là. » · « L'examinateur veut me voir réussir. » · « Si je trébuche, je reprends, pas grave. »<\u002Fp>\n<\u002Fblockquote><\u002Fmain><\u002Fdiv><button id=\"toTop\" class=\"totop\" title=\"Revenir en haut\">↑<\u002Fbutton><script>\nconst doc=document.getElementById('doc');\nconst toc=document.getElementById('toc');\nconst used={};\nfunction slug(s){return (s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')\n  .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,48))||'sec';}\nfunction uid(b){let id=b,i=1;while(used[id]){id=b+'-'+(++i);}used[id]=1;return id;}\n\n// 1) ids + sidebar nav\nlet curTop=null,curSub=null;\n[...doc.children].forEach(el=>{\n  if(el.classList&&el.classList.contains('cover'))return;\n  if(el.tagName==='H1'||el.tagName==='H2'){\n    const txt=el.textContent.trim();\n    el.id=uid(slug(txt));\n    if(el.tagName==='H1'){\n      const li=document.createElement('li');li.className='nav-top';\n      const a=document.createElement('a');a.href='#'+el.id;a.textContent=txt;\n      li.appendChild(a);toc.appendChild(li);curTop=li;curSub=null;\n    } else if(/^TEXTE/i.test(txt)){\n      if(!curSub){curSub=document.createElement('ul');curSub.className='nav-sub';(curTop||toc).appendChild(curSub);}\n      const li=document.createElement('li');const a=document.createElement('a');\n      a.href='#'+el.id;a.dataset.t='1';\n      let lab=txt.replace(/^TEXTE\\s*/i,'');\n      const m=lab.match(/^(\\d+)\\s*[—–-]\\s*([^,(]+)/);\n      a.textContent=m?(m[1]+' · '+m[2].trim()):lab.slice(0,40);\n      li.appendChild(a);curSub.appendChild(li);\n    } else if(/^OBJET/.test(txt)){\n      if(!curSub){curSub=document.createElement('ul');curSub.className='nav-sub';(curTop||toc).appendChild(curSub);}\n      const li=document.createElement('li');li.className='nav-div';\n      li.textContent=txt.split(/[—–]/)[0].replace('OBJET','Objet').trim();\n      curSub.appendChild(li);\n    }\n  }\n});\n\n// 2) wrap TEXTE sections into collapsible cards + progress\nlet total=0;\n[...doc.querySelectorAll(':scope > h2')].forEach(h=>{\n  if(!/^TEXTE/i.test(h.textContent.trim()))return;\n  total++;\n  const card=document.createElement('section');card.className='card';card.dataset.id=h.id;\n  h.parentNode.insertBefore(card,h);\n  card.appendChild(h);h.classList.add('card-head');\n  const bodyDiv=document.createElement('div');bodyDiv.className='card-body';\n  let n=card.nextSibling;\n  while(n&&!(n.nodeType===1&&(n.tagName==='H1'||n.tagName==='H2'))){const nx=n.nextSibling;bodyDiv.appendChild(n);n=nx;}\n  card.appendChild(bodyDiv);\n  const revu=document.createElement('button');revu.className='revu';revu.type='button';revu.textContent='À revoir';\n  h.appendChild(revu);\n  if(localStorage.getItem('revu:'+h.id)==='1'){card.classList.add('done');revu.textContent='✓ Revu';}\n  h.addEventListener('click',e=>{if(e.target===revu)return;card.classList.toggle('collapsed');});\n  revu.addEventListener('click',e=>{e.stopPropagation();\n    const done=card.classList.toggle('done');\n    revu.textContent=done?'✓ Revu':'À revoir';\n    localStorage.setItem('revu:'+h.id,done?'1':'0');updateProgress();});\n});\nfunction updateProgress(){\n  const done=document.querySelectorAll('.card.done').length;\n  document.getElementById('pbar').style.width=(total?done/total*100:0)+'%';\n  document.getElementById('pcount').textContent=done+'/'+total;\n}\nupdateProgress();\n\n// 3) scrollspy\nconst links=[...toc.querySelectorAll('a')];\nconst byId={};links.forEach(a=>byId[a.getAttribute('href').slice(1)]=a);\nconst io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){\n  links.forEach(a=>a.classList.remove('active'));\n  const a=byId[e.target.id];if(a)a.classList.add('active');\n}})},{rootMargin:'-12% 0px -78% 0px'});\nObject.keys(byId).forEach(id=>{const el=document.getElementById(id);if(el)io.observe(el);});\n\n// 4) search\nconst search=document.getElementById('search');\nsearch.addEventListener('input',()=>{\n  const q=search.value.trim().toLowerCase();\n  document.querySelectorAll('.card').forEach(c=>{\n    const hit=!q||c.textContent.toLowerCase().includes(q);\n    c.style.display=hit?'':'none';\n  });\n  document.querySelectorAll('.nav-sub a[data-t]').forEach(a=>{\n    const c=document.querySelector('.card[data-id=\"'+a.getAttribute('href').slice(1)+'\"]');\n    a.parentElement.style.display=(!q||(c&&c.style.display!=='none'))?'':'none';\n  });\n});\n\n// 5) tools\ndocument.querySelector('.tools').addEventListener('click',e=>{\n  const act=e.target.dataset.act;if(!act)return;\n  if(act==='expand')document.querySelectorAll('.card').forEach(c=>c.classList.remove('collapsed'));\n  if(act==='collapse')document.querySelectorAll('.card').forEach(c=>c.classList.add('collapsed'));\n  if(act==='reset'){if(confirm('Réinitialiser la progression « Revu » ?')){\n    document.querySelectorAll('.card.done').forEach(c=>{c.classList.remove('done');\n      c.querySelector('.revu').textContent='À revoir';localStorage.setItem('revu:'+c.dataset.id,'0');});\n    updateProgress();}}\n});\n\n// 6) theme\nconst themeBtn=document.getElementById('themeBtn');\nif(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');themeBtn.textContent='☀️';}\nthemeBtn.addEventListener('click',()=>{\n  const d=document.body.classList.toggle('dark');\n  themeBtn.textContent=d?'☀️':'🌙';localStorage.setItem('theme',d?'dark':'light');});\n\n// 7) mobile sidebar\nconst sb=document.getElementById('sidebar'),ov=document.getElementById('overlay');\nfunction closeSb(){sb.classList.remove('open');ov.classList.remove('show');}\ndocument.getElementById('menuBtn').addEventListener('click',()=>{sb.classList.toggle('open');ov.classList.toggle('show');});\nov.addEventListener('click',closeSb);\ntoc.addEventListener('click',e=>{if(e.target.tagName==='A'&&window.innerWidth<=900)closeSb();});\n\n// 8) back to top\nconst tt=document.getElementById('toTop');\naddEventListener('scroll',()=>{tt.classList.toggle('show',scrollY>500);});\ntt.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));\n\n// 9) re-apply hash scroll after the DOM was transformed (cards wrapped)\nif(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));\n  if(el){requestAnimationFrame(()=>scrollTo(0, el.getBoundingClientRect().top+scrollY-60));}}\n<\u002Fscript><\u002Fbody><\u002Fhtml>"
  </script>
</body>
