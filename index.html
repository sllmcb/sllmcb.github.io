e Lambersart — 1G⁴<\u002Fstrong>\n<strong>Liste des 16 textes — 4 objets d'étude<\u002Fstrong>\n<strong>Œuvre choisie pour l'entretien : <em>Art<\u002Fem> de Yasmina Reza<\u002Fstrong><\u002Fp>\n<div class=\"cover-box\">\n<p><strong>Ce dossier couvre l'INTÉGRALITÉ de la liste, y compris la littérature d'idées (textes 13 à 16 : La Boétie + La Fontaine) qui manquait dans la version « bac blanc ».<\u002Fstrong><\u002Fp>\n<\u002Fdiv>\n<table>\n<thead>\n<tr>\n<th>#<\u002Fth>\n<th>Objet d'étude<\u002Fth>\n<th>Œuvre intégrale<\u002Fth>\n<th>Parcours<\u002Fth>\n<th>Textes<\u002Fth>\n<\u002Ftr>\n<\u002Fthead>\n<tbody>\n<tr>\n<td>1<\u002Ftd>\n<td>Poésie XIX<sup>e<\u002Fsup>–XXI<sup>e<\u002Fsup><\u002Ftd>\n<td>H. Dorion, <em>Mes Forêts<\u002Fem><\u002Ftd>\n<td>La poésie, la nature, l'intime<\u002Ftd>\n<td>1·2·3·4<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>2<\u002Ftd>\n<td>Théâtre XVII<sup>e<\u002Fsup>–XXI<sup>e<\u002Fsup><\u002Ftd>\n<td>N. Sarraute, <em>Pour un oui ou pour un non<\u002Fem><\u002Ftd>\n<td>Théâtre et dispute<\u002Ftd>\n<td>5·6·7·8<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>3<\u002Ftd>\n<td>Roman Moyen Âge–XXI<sup>e<\u002Fsup><\u002Ftd>\n<td>Abbé Prévost, <em>Manon Lescaut<\u002Fem><\u002Ftd>\n<td>Personnages en marge, plaisirs du romanesque<\u002Ftd>\n<td>9·10·11·12<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>4<\u002Ftd>\n<td>Littérature d'idées XVI<sup>e<\u002Fsup>–XVIII<sup>e<\u002Fsup><\u002Ftd>\n<td>La Boétie, <em>Discours de la servitude volontaire<\u002Fem><\u002Ftd>\n<td><strong>Défendre et entretenir la liberté<\u002Fstrong><\u002Ftd>\n<td><strong>13·14·15·16<\u002Fstrong><\u002Ftd>\n<\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n<h1>PARTIE 0 — MÉTHODOLOGIE DE L'ÉPREUVE<\u002Fh1>\n<h2>1. Le format précis (20 min, après 30 min de préparation)<\u002Fh2>\n<p>Tu tires <strong>un texte au sort<\u002Fstrong> parmi les 16. L'examinateur t'indique le passage à expliquer et <strong>souligne une phrase<\u002Fstrong> pour la question de grammaire.<\u002Fp>\n<table>\n<thead>\n<tr>\n<th>Temps<\u002Fth>\n<th>Épreuve<\u002Fth>\n<th>Durée<\u002Fth>\n<th>Points<\u002Fth>\n<\u002Ftr>\n<\u002Fthead>\n<tbody>\n<tr>\n<td><strong>1<\u002Fstrong><\u002Ftd>\n<td>Lecture expressive à voix haute<\u002Ftd>\n<td>≈ 2 min<\u002Ftd>\n<td><strong>2<\u002Fstrong><\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><strong>1<\u002Fstrong><\u002Ftd>\n<td>Explication linéaire<\u002Ftd>\n<td>≈ 8 min<\u002Ftd>\n<td><strong>8<\u002Fstrong><\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><strong>1<\u002Fstrong><\u002Ftd>\n<td>Question de grammaire<\u002Ftd>\n<td>≈ 2 min<\u002Ftd>\n<td><strong>2<\u002Fstrong><\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><strong>2<\u002Fstrong><\u002Ftd>\n<td>Présentation de l'œuvre choisie<\u002Ftd>\n<td>≈ 2 min<\u002Ftd>\n<td><strong>8<\u002Fstrong><\u002Ftd>\n<\u002Ftr>\n<tr>\n<td><strong>2<\u002Fstrong><\u002Ftd>\n<td>Entretien avec l'examinateur<\u002Ftd>\n<td>≈ 6 min<\u002Ftd>\n<td><em>(8)<\u002Fem><\u002Ftd>\n<\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<blockquote>\n<p><strong>Total : 20 / 20.<\u002Fstrong> Le Temps 1 (texte) vaut 12 points, le Temps 2 (œuvre + entretien) vaut 8 points.<\u002Fp>\n<\u002Fblockquote>\n<h2>2. La lecture expressive (2 points — ne la rate pas)<\u002Fh2>\n<p>C'est ta <strong>première impression<\u002Fstrong>. Quatre règles :<\u002Fp>\n<ol>\n<li><strong>Ralentis<\u002Fstrong> — le stress accélère ; ralentis volontairement.<\u002Fli>\n<li><strong>Articule<\u002Fstrong> — détache les syllabes des mots difficiles.<\u002Fli>\n<li><strong>Respecte la ponctuation<\u002Fstrong> — pause courte à la virgule, longue au point.<\u002Fli>\n<li><strong>Mets le ton<\u002Fstrong> — une question monte, une exclamation s'affirme ; baisse la voix sur l'émotion.<\u002Fli>\n<\u002Fol>\n<blockquote>\n<p><em>Poésie<\u002Fem> : marque la fin de vers par une mini-pause, <strong>respecte les enjambements<\u002Fstrong> (ne t'arrête pas si la phrase continue). <em>Théâtre<\u002Fem> : change subtilement de voix entre les personnages. <em>Prose<\u002Fem> : suis les groupes de souffle, ne hache pas.<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Si tu butes sur un mot : tu continues, tu ne reviens pas en arrière, tu ne t'excuses pas.<\u002Fstrong><\u002Fp>\n<h2>3. L'explication linéaire (8 points — le cœur de la note)<\u002Fh2>\n<h3>A. Introduction (≈ 1 min 30) — 4 étapes obligatoires<\u002Fh3>\n<ol>\n<li><strong>Accroche / auteur + contexte<\u002Fstrong> (1-2 phrases).<\u002Fli>\n<li><strong>Œuvre + situation du passage<\u002Fstrong> (1-2 phrases).<\u002Fli>\n<li><strong>Problématique<\u002Fstrong> (1 phrase claire).<\u002Fli>\n<li><strong>Annonce des mouvements<\u002Fstrong> (avec les vers/lignes).<\u002Fli>\n<\u002Fol>\n<h3>B. Développement (5-6 min) — mouvement par mouvement<\u002Fh3>\n<p>Pour <strong>chaque<\u002Fstrong> mouvement : <em>« Le premier mouvement, des vers X à Y, montre… »<\u002Fem> puis tu analyses, puis une <strong>phrase-bilan<\u002Fstrong> qui ferme le mouvement.<\u002Fp>\n<blockquote>\n<h3>⚙️ LE SECRET D'UNE BONNE EXPLICATION<\u002Fh3>\n<p><strong>CITATION → PROCÉDÉ → EFFET → SENS.<\u002Fstrong> Répète ce schéma à chaque analyse. C'est ce qui sépare une <strong>explication<\u002Fstrong> d'une <strong>paraphrase<\u002Fstrong>. Ne dis jamais « c'est beau » : dis « une métaphore filée », « une anaphore », « un champ lexical de… ».<\u002Fp>\n<\u002Fblockquote>\n<h3>C. Conclusion (≈ 1 min) — 2 étapes<\u002Fh3>\n<ol>\n<li><strong>Réponse à la problématique<\u002Fstrong> (ferme, nette).<\u002Fli>\n<li><strong>Ouverture<\u002Fstrong> — vers un autre texte du parcours, une autre œuvre, un autre art.<\u002Fli>\n<\u002Fol>\n<h2>4. La question de grammaire (2 points) — méthode en 4 temps<\u002Fh2>\n<ol>\n<li><strong>Lis la phrase<\u002Fstrong> à voix haute, lentement.<\u002Fli>\n<li><strong>Identifie<\u002Fstrong> le fait (type de phrase, négation, interrogation, proposition…).<\u002Fli>\n<li><strong>Réponds<\u002Fstrong> avec le <strong>vocabulaire technique précis<\u002Fstrong>.<\u002Fli>\n<li><strong>Justifie<\u002Fstrong> par un <strong>repère dans la phrase<\u002Fstrong> (le mot subordonnant, l'inversion, le « ne… pas »…).<\u002Fli>\n<\u002Fol>\n<h2>5. L'entretien (8 points)<\u002Fh2>\n<ul>\n<li><strong>Présentation libre (2 min)<\u002Fstrong> : un texte d'≈ 250 mots appris — <strong>QUOI<\u002Fstrong> (œuvre) / <strong>POURQUOI MOI<\u002Fstrong> (choix personnel sincère) / <strong>LIENS<\u002Fstrong> (autres textes, films, lectures).<\u002Fli>\n<li><strong>Entretien (6 min)<\u002Fstrong> : <strong>ne réponds jamais par oui/non<\u002Fstrong>. Développe, cite des passages, fais des liens, donne ton avis. Si tu ne sais pas : <em>« Je n'avais pas réfléchi à ça, mais je dirais que… »<\u002Fem> + une hypothèse.<\u002Fli>\n<\u002Ful>\n<h1>PARTIE 1 — TOUTE LA GRAMMAIRE UTILE<\u002Fh1>\n<blockquote>\n<p>Au bac, les <strong>3 thèmes<\u002Fstrong> qui tombent le plus : <strong>l'interrogation<\u002Fstrong>, <strong>la négation<\u002Fstrong>, <strong>les propositions subordonnées<\u002Fstrong>. Maîtrise-les et tu sécurises tes 2 points.<\u002Fp>\n<\u002Fblockquote>\n<h2>A. L'interrogation<\u002Fh2>\n<h3>1. Directe vs indirecte<\u002Fh3>\n<ul>\n<li><strong>DIRECTE<\u002Fstrong> : la phrase <em>est<\u002Fem> la question, finit par <strong>?<\u002Fstrong>. Trois constructions :<\u002Fli>\n<li><em>Inversion sujet-verbe<\u002Fem> : « Avez-vous fini ? »<\u002Fli>\n<li><em>Avec « est-ce que »<\u002Fem> : « Est-ce que tu viens ? »<\u002Fli>\n<li><em>Par l'intonation seule<\u002Fem> : « Tu viens ? »<\u002Fli>\n<li><strong>INDIRECTE<\u002Fstrong> : la question est <strong>enchâssée<\u002Fstrong> dans une subordonnée, <strong>pas de ?<\u002Fstrong>, <strong>pas d'inversion<\u002Fstrong>, <strong>pas de « est-ce que »<\u002Fstrong>, introduite par un <strong>subordonnant<\u002Fstrong> (<em>si, ce que, ce qui, quand, où, pourquoi, comment, qui, quel<\u002Fem>).<\u002Fli>\n<li>« Je voudrais savoir <strong>si<\u002Fstrong> tu viens. » · « Je me demande <strong>ce que<\u002Fstrong> tu fais. »<\u002Fli>\n<\u002Ful>\n<h3>2. Totale vs partielle<\u002Fh3>\n<ul>\n<li><strong>Totale<\u002Fstrong> : réponse attendue <strong>oui / non<\u002Fstrong>. « Tu viens ? »<\u002Fli>\n<li><strong>Partielle<\u002Fstrong> : réponse = une <strong>information précise<\u002Fstrong> (introduite par <em>qui, que, quoi, où, quand, comment, pourquoi, combien, lequel<\u002Fem>). « <strong>Quand<\u002Fstrong> viens-tu ? »<\u002Fli>\n<\u002Ful>\n<blockquote>\n<p><strong>Modèle de réponse complet<\u002Fstrong> — <em>« Je voudrais savoir ce qu'il s'est passé. »<\u002Fem>\n« Cette phrase contient une <strong>interrogation indirecte<\u002Fstrong>. La principale \"Je voudrais savoir\" exprime une question ; la subordonnée <strong>interrogative indirecte<\u002Fstrong> \"ce qu'il s'est passé\" est introduite par le pronom interrogatif \"ce que\". Elle est <strong>partielle<\u002Fstrong> (la réponse n'est pas oui/non mais une information). Trois marques la distinguent de la directe : pas de ?, pas d'inversion, pas de \"est-ce que\". La forme directe serait : <em>Que s'est-il passé ?<\u002Fem> »<\u002Fp>\n<\u002Fblockquote>\n<h2>B. La négation<\u002Fh2>\n<ul>\n<li><strong>Totale<\u002Fstrong> : porte sur toute la phrase → <em>ne… pas / point / jamais / plus / rien<\u002Fem>. « Je ne viens pas. »<\u002Fli>\n<li><strong>Partielle<\u002Fstrong> : porte sur un élément. « <strong>Personne<\u002Fstrong> ne vient » (sujet) ; « Je ne vois <strong>rien<\u002Fstrong> » (objet).<\u002Fli>\n<li><strong>Restrictive<\u002Fstrong> : <em>ne… que<\u002Fem> = <strong>seulement<\u002Fstrong> (ce n'est <strong>pas<\u002Fstrong> une vraie négation). « Je ne mange <strong>que<\u002Fstrong> des légumes. »<\u002Fli>\n<li><strong>Lexicale<\u002Fstrong> : un mot porte la négation (préfixes <em>in-, dé-, mé-<\u002Fem>). « C'est <strong>impossible<\u002Fstrong>. »<\u002Fli>\n<li><strong>Explétive<\u002Fstrong> : <em>ne<\u002Fem> seul, qui <strong>ne nie pas<\u002Fstrong> (on peut le supprimer). « Je crains qu'il <strong>ne<\u002Fstrong> pleuve. »<\u002Fli>\n<li><strong>Aspectuelle<\u002Fstrong> : <em>ne… plus<\u002Fem> (arrêt d'un procès), <em>ne… pas encore<\u002Fem> (procès non commencé).<\u002Fli>\n<\u002Ful>\n<blockquote>\n<p><strong>Modèle<\u002Fstrong> — <em>« Je n'espère plus rien, mon Dieu. »<\u002Fem> (Texte 1) :\n« <strong>Double marque négative<\u002Fstrong> : \"ne… plus\" est une négation <strong>aspectuelle<\u002Fstrong> (arrêt du procès \"espérer\"), renforcée par le pronom indéfini négatif \"rien\". La négation est <strong>totale<\u002Fstrong> et <strong>intensifiée<\u002Fstrong> : il ne reste absolument rien à espérer. \"mon Dieu\" est une <strong>apostrophe<\u002Fstrong> (pas de fonction syntaxique). »<\u002Fp>\n<\u002Fblockquote>\n<h2>C. Les propositions subordonnées<\u002Fh2>\n<blockquote>\n<p><strong>Une proposition = un groupe de mots organisé autour d'un verbe conjugué.<\u002Fstrong> On compte les verbes conjugués pour compter les propositions.<\u002Fp>\n<\u002Fblockquote>\n<h3>Les 3 grands types de propositions<\u002Fh3>\n<ul>\n<li><strong>Indépendante<\u002Fstrong> : ne dépend de personne. « Il pleut. » (juxtaposées par <code>, ; :<\u002Fcode> / coordonnées par <em>mais, ou, et, donc, or, ni, car<\u002Fem>)<\u002Fli>\n<li><strong>Principale<\u002Fstrong> : commande une subordonnée. « Je sais que tu viens. »<\u002Fli>\n<li><strong>Subordonnée<\u002Fstrong> : dépend d'une autre. « …que tu viens. »<\u002Fli>\n<\u002Ful>\n<h3>Les subordonnées les plus fréquentes<\u002Fh3>\n<ul>\n<li><strong>Relative<\u002Fstrong> — introduite par un <strong>pronom relatif<\u002Fstrong> (<em>qui, que, dont, où, lequel<\u002Fem>), complète un <strong>nom antécédent<\u002Fstrong>. « L'homme <strong>qui parle<\u002Fstrong> est mon ami. » → fonction : <em>complément de l'antécédent<\u002Fem>.<\u002Fli>\n<li><strong>Conjonctive complétive<\u002Fstrong> — introduite par <strong>« que »<\u002Fstrong> après un verbe (penser, dire, vouloir…), <strong>non déplaçable<\u002Fstrong>. « Je sais <strong>que tu viens<\u002Fstrong>. » → fonction : <strong>COD<\u002Fstrong>.<\u002Fli>\n<li><strong>Conjonctive circonstancielle<\u002Fstrong> — introduite par une <strong>locution conjonctive<\u002Fstrong>, <strong>déplaçable et supprimable<\u002Fstrong>. Fonction : <strong>CC<\u002Fstrong> (temps : <em>quand, lorsque, alors que<\u002Fem> ; cause : <em>parce que, puisque<\u002Fem> ; conséquence : <em>si bien que, tellement… que<\u002Fem> ; concession/opposition : <em>bien que, quoique, même si, alors que<\u002Fem> ; condition : <em>si<\u002Fem> ; but : <em>afin que, pour que<\u002Fem>).<\u002Fli>\n<li><strong>Interrogative indirecte<\u002Fstrong> — introduite par <em>si, ce que, où…<\u002Fem> (voir A).<\u002Fli>\n<li><strong>Infinitive<\u002Fstrong> — verbe à l'infinitif + sujet propre, après un verbe de perception. « Je vois <strong>les enfants jouer<\u002Fstrong>. »<\u002Fli>\n<li><strong>Participiale<\u002Fstrong> — verbe au participe + sujet propre. « <strong>La nuit tombée<\u002Fstrong>, nous rentrons. »<\u002Fli>\n<\u002Ful>\n<blockquote>\n<p><strong>Méthode-bilan d'une phrase complexe<\u002Fstrong> : 1) compte les verbes conjugués → nombre de propositions ; 2) repère principale / subordonnée ; 3) nomme la <strong>nature<\u002Fstrong> de la subordonnée + son <strong>mot introducteur<\u002Fstrong> + sa <strong>fonction<\u002Fstrong>.<\u002Fp>\n<\u002Fblockquote>\n<h3>Piège fréquent : les valeurs de « que »<\u002Fh3>\n<ol>\n<li><strong>Pronom relatif<\u002Fstrong> (a un antécédent, fonction dans la relative) : « Les lettres <strong>que<\u002Fstrong> tu envoies. »<\u002Fli>\n<li><strong>Conjonction de subordination<\u002Fstrong> (après un verbe, complétive, aucune fonction) : « Je sais <strong>que<\u002Fstrong> tu pars. »<\u002Fli>\n<li><strong>Adverbe exclamatif/interrogatif<\u002Fstrong> : « <strong>Que<\u002Fstrong> tu as grandi ! » / « <strong>Que<\u002Fstrong> veux-tu ? »<\u002Fli>\n<li><strong>Restrictif<\u002Fstrong> (ne… que) : « Tu ne dis <strong>que<\u002Fstrong> quelques mots. »<\u002Fli>\n<\u002Fol>\n<h2>D. Types et formes de phrases<\u002Fh2>\n<ul>\n<li><strong>4 types<\u002Fstrong> : déclaratif, interrogatif, exclamatif, impératif (injonctif).<\u002Fli>\n<li><strong>Formes<\u002Fstrong> (combinables) : affirmative/négative · active/passive · neutre/<strong>emphatique<\u002Fstrong> (mise en relief par <em>c'est… qui/que<\u002Fem> ou <strong>dislocation<\u002Fstrong> : « Moi, je… ») · personnelle/<strong>impersonnelle<\u002Fstrong> (« Il pleut », « Il faut »).<\u002Fli>\n<\u002Ful>\n<h2>E. Les 15 figures de style à mobiliser dans l'explication<\u002Fh2>\n<table>\n<thead>\n<tr>\n<th>Figure<\u002Fth>\n<th>Définition express<\u002Fth>\n<th>Exemple<\u002Fth>\n<\u002Ftr>\n<\u002Fthead>\n<tbody>\n<tr>\n<td>Métaphore<\u002Ftd>\n<td>comparaison sans outil<\u002Ftd>\n<td>« cette femme est une rose »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Comparaison<\u002Ftd>\n<td>avec outil (<em>comme, tel<\u002Fem>)<\u002Ftd>\n<td>« belle comme une rose »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Personnification<\u002Ftd>\n<td>traits humains à une chose<\u002Ftd>\n<td>« le vent murmure »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Allégorie<\u002Ftd>\n<td>idée abstraite en figure concrète<\u002Ftd>\n<td>« la Justice est aveugle »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Anaphore<\u002Ftd>\n<td>répétition en tête<\u002Ftd>\n<td>« Je n'espère plus rien… Je n'espère… »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Énumération<\u002Ftd>\n<td>liste qui s'allonge<\u002Ftd>\n<td>« guerres famines tristes duretés »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Gradation<\u002Ftd>\n<td>suite croissante/décroissante<\u002Ftd>\n<td>« Va, cours, vole »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Antithèse<\u002Ftd>\n<td>deux idées opposées<\u002Ftd>\n<td>« la chaleur glacée »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Oxymore<\u002Ftd>\n<td>antithèse en 2 mots<\u002Ftd>\n<td>« cette obscure clarté »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Chiasme<\u002Ftd>\n<td>croisement ABBA<\u002Ftd>\n<td>« manger pour vivre, non vivre pour manger »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Parallélisme<\u002Ftd>\n<td>structure répétée ABAB<\u002Ftd>\n<td>« je veux le voir, je veux lui parler »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Hyperbole<\u002Ftd>\n<td>exagération<\u002Ftd>\n<td>« mille fois je te l'ai dit »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Litote<\u002Ftd>\n<td>dire moins pour suggérer plus<\u002Ftd>\n<td>« va, je ne te hais point »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Asyndète<\u002Ftd>\n<td>suppression de liens logiques<\u002Ftd>\n<td>« il vient, il parle, il pleure »<\u002Ftd>\n<\u002Ftr>\n<tr>\n<td>Aposiopèse<\u002Ftd>\n<td>phrase interrompue (…)<\u002Ftd>\n<td>omniprésente chez Sarraute<\u002Ftd>\n<\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<h1>PARTIE 2 — LES 4 OBJETS D'ÉTUDE ET LEURS PARCOURS<\u002Fh1>\n<blockquote>\n<p>À mobiliser dans tes <strong>ouvertures de conclusion<\u002Fstrong> et pendant <strong>l'entretien<\u002Fstrong>. Connais le parcours <strong>par cœur<\u002Fstrong> : c'est lui qui relie l'œuvre intégrale au texte complémentaire.<\u002Fp>\n<\u002Fblockquote>\n<h2>Objet 1 · POÉSIE — <em>Mes Forêts<\u002Fem>, Hélène Dorion (2021)<\u002Fh2>\n<h3>Parcours : « La poésie, la nature, l'intime »<\u002Fh3>\n<ul>\n<li><strong>Hélène Dorion<\u002Fstrong> (née en 1958 au Québec) : l'une des grandes voix de la poésie francophone contemporaine. <em>Mes Forêts<\u002Fem> (2021) est entré au programme du bac — fait rare pour une autrice <strong>vivante<\u002Fstrong>.<\u002Fli>\n<li><strong>Le titre<\u002Fstrong> : <em>Mes<\u002Fem> (l'intime, le possessif) + <em>Forêts<\u002Fem> (la nature). La forêt est une <strong>métaphore<\u002Fstrong> de l'intériorité, du temps, de la mémoire.<\u002Fli>\n<li><strong>Structure<\u002Fstrong> : 5 poèmes « Mes forêts » encadrent 4 sections (<em>L'écorce incertaine, Une chute de galets, L'onde du chaos, Le bruissement du temps<\u002Fem>).<\u002Fli>\n<li><strong>Idées-forces<\u002Fstrong> : la nature n'est pas un <strong>décor<\u002Fstrong> mais un <strong>espace intérieur<\u002Fstrong> et un <strong>espace de connaissance de soi<\u002Fstrong> ; la forêt devient refuge face au <strong>chaos du monde<\u002Fstrong> (crises écologiques, médiatiques, géopolitiques) ; la poésie « donne sens à ce qu'on appelle humanité ».<\u002Fli>\n<li><strong>Texte complémentaire<\u002Fstrong> : Francis <strong>Jammes<\u002Fstrong>, <em>Le Deuil des primevères<\u002Fem> (texte 1) — la nature comme miroir de l'âme et chemin vers le divin. <strong>Filiation<\u002Fstrong> : de Jammes à Dorion, la nature spiritualisée.<\u002Fli>\n<\u002Ful>\n<h2>Objet 2 · THÉÂTRE — <em>Pour un oui ou pour un non<\u002Fem>, Nathalie Sarraute (1982)<\u002Fh2>\n<h3>Parcours : « Théâtre et dispute »<\u002Fh3>\n<ul>\n<li><strong>Nathalie Sarraute<\u002Fstrong> (1900-1999) : autrice majeure du <strong>Nouveau Roman<\u002Fstrong>. Toute son œuvre explore les <strong>tropismes<\u002Fstrong> : ces mouvements intérieurs <strong>imperceptibles<\u002Fstrong> qui régissent en secret les rapports humains.<\u002Fli>\n<li><strong>La pièce<\u002Fstrong> : deux amis, <strong>H1 et H2<\u002Fstrong>, voient leur amitié se fissurer à cause d'une parole minuscule (« C'est bien… ça » dit sur un certain ton).<\u002Fli>\n<li><strong>Idées-forces<\u002Fstrong> : la dispute n'a <strong>pas d'objet rationnel<\u002Fstrong> ; elle se joue <strong>sous les mots<\u002Fstrong>, dans les silences, les hésitations, les <strong>aposiopèses<\u002Fstrong> ; le langage est à la fois l'<strong>arme<\u002Fstrong> et le <strong>lieu<\u002Fstrong> du conflit ; « rien qu'on puisse dire » = l'<strong>indicible<\u002Fstrong> au cœur de la pièce.<\u002Fli>\n<li><strong>Texte complémentaire<\u002Fstrong> : <strong>Molière<\u002Fstrong>, <em>Le Misanthrope<\u002Fem> (texte 6) — la dispute amicale <strong>classique<\u002Fstrong>, en alexandrins clairs (Alceste vs Philinte). <strong>Contraste<\u002Fstrong> : le <em>dicible<\u002Fem> classique vs l'<em>indicible<\u002Fem> moderne de Sarraute.<\u002Fli>\n<\u002Ful>\n<h2>Objet 3 · ROMAN — <em>Manon Lescaut<\u002Fem>, Abbé Prévost (1731)<\u002Fh2>\n<h3>Parcours : « Personnages en marge, plaisirs du romanesque »<\u002Fh3>\n<ul>\n<li><strong>Abbé Prévost<\u002Fstrong> (1697-1763) : romancier, figure du libertin repenti. <em>Manon Lescaut<\u002Fem> est le dernier tome des <em>Mémoires d'un homme de qualité<\u002Fem>.<\u002Fli>\n<li><strong>L'histoire<\u002Fstrong> : la passion dévorante du chevalier <strong>Des Grieux<\u002Fstrong> pour <strong>Manon<\u002Fstrong>, qui le précipite hors de sa classe sociale (tricherie, prison, meurtre, déportation, mort dans le désert américain).<\u002Fli>\n<li><strong>Idées-forces<\u002Fstrong> : des <strong>personnages en marge<\u002Fstrong> (amants maudits, hors-la-loi) ; le <strong>plaisir romanesque<\u002Fstrong> (rebondissements, pathétique, séduction) ; l'<strong>ambiguïté morale<\u002Fstrong> — Prévost prétend faire œuvre morale (« traité de morale réduit agréablement en exercices ») tout en fascinant par le vice.<\u002Fli>\n<li><strong>Texte complémentaire<\u002Fstrong> : André <strong>Breton<\u002Fstrong>, <em>Nadja<\u002Fem> (texte 12) — la rencontre <strong>surréaliste<\u002Fstrong> d'une figure féminine en marge. <strong>Filiation<\u002Fstrong> : la fascination amoureuse pour l'inconnue, le romanesque revisité par le merveilleux.<\u002Fli>\n<\u002Ful>\n<h2>Objet 4 · LITTÉRATURE D'IDÉES — <em>Discours de la servitude volontaire<\u002Fem>, La Boétie (1577)<\u002Fh2>\n<h3>Parcours : « Défendre et entretenir la liberté » — <em>(le nouvel objet, textes 13 à 16)<\u002Fem><\u002Fh3>\n<h3>L'auteur et l'œuvre<\u002Fh3>\n<ul>\n<li><strong>Étienne de La Boétie<\u002Fstrong> (1530-1563) : magistrat au parlement de Bordeaux, <strong>humaniste<\u002Fstrong> de haute culture, ami intime de <strong>Montaigne<\u002Fstrong> (c'est lui qui publiera le texte). La Boétie meurt jeune, de la tuberculose, à 32 ans.<\u002Fli>\n<li>Il écrit le <em>Discours<\u002Fem> <strong>très jeune<\u002Fstrong> (entre 16 et 18 ans). Publié <strong>à titre posthume<\u002Fstrong> (1574-1577), il sera récupéré par les <strong>protestants<\u002Fstrong> en pleine guerre civile, puis par les <strong>révolutionnaires de 1789<\u002Fstrong>, puis par les <strong>démocrates<\u002Fstrong> du XIX<sup>e<\u002Fsup> — preuve de sa <strong>richesse interprétative<\u002Fstrong> et de son caractère <strong>vivant<\u002Fstrong>.<\u002Fli>\n<li>Aussi appelé <strong><em>Contr'un<\u002Fem><\u002Fstrong>.<\u002Fli>\n<\u002Ful>\n<h3>La thèse — révolutionnaire<\u002Fh3>\n<blockquote>\n<p>La <strong>tyrannie<\u002Fstrong> (domination de tous par un seul) ne tient <strong>pas par la force<\u002Fstrong> : elle tient parce que <strong>le peuple y consent volontairement<\u002Fstrong>. Le tyran « n'a d'autre puissance que celle qu'ils lui donnent ».<\u002Fp>\n<\u002Fblockquote>\n<ul>\n<li>D'où l'<strong>oxymore<\u002Fstrong> du titre : <strong>« servitude volontaire »<\u002Fstrong> — une servitude que l'on se choisit.<\u002Fli>\n<li>La conséquence est lumineuse : nul besoin de combattre, de tuer le tyran. <strong>Il suffit de cesser de le servir.<\u002Fstrong> <em>« Soyez résolus à ne plus servir, et vous voilà libres. »<\u002Fem><\u002Fli>\n<li><strong>Image-clé<\u002Fstrong> : le tyran est un <strong>colosse aux pieds d'argile<\u002Fstrong> — « comme un grand colosse dont on a dérobé la base, il s'effondre de son propre poids et se brise ».<\u002Fli>\n<\u002Ful>\n<h3>Pourquoi les hommes acceptent-ils de servir ? (les 3 causes)<\u002Fh3>\n<ol>\n<li><strong>L'habitude / l'accoutumance<\u002Fstrong> : on <strong>naît<\u002Fstrong> dans la servitude et on la prend pour l'état de nature. <em>« Ils prennent pour leur état de nature leur état de naissance. »<\u002Fem> (→ <strong>texte 15<\u002Fstrong>, l'image des chevaux dressés).<\u002Fli>\n<li><strong>Les ruses du tyran<\u002Fstrong> : le <strong>divertissement<\u002Fstrong> (jeux, théâtres, festins — les Lydiens « abrutis » pour les détourner de la révolte ; ancêtre du <em>« panem et circenses »<\u002Fem>) et les <strong>mythes<\u002Fstrong> qui sacralisent le pouvoir (légendes royales, droit divin → <strong>texte 16<\u002Fstrong>).<\u002Fli>\n<li><strong>Le système pyramidal<\u002Fstrong> : le tyran s'appuie sur quelques proches, qui en tiennent d'autres, etc. — une chaîne de <strong>« tyranneaux »<\u002Fstrong> complices.<\u002Fli>\n<\u002Fol>\n<h3>Le parcours « DÉFENDRE et ENTRETENIR la liberté »<\u002Fh3>\n<ul>\n<li><strong>La liberté est NATURELLE.<\u002Fstrong> Nous sommes nés « frères et libres » ; même les <strong>animaux<\u002Fstrong> se défendent « des ongles, des cornes, du bec » pour rester libres. Redevenir libre, c'est « de bête redevenir homme ».<\u002Fli>\n<li><strong>DÉFENDRE la liberté<\u002Fstrong> = par la <strong>raison<\u002Fstrong> et la <strong>connaissance<\u002Fstrong> : comprendre les <strong>mécanismes<\u002Fstrong> de la tyrannie (typologie des tyrans : par élection, par les armes, par hérédité), repérer la contrainte et la <strong>tromperie<\u002Fstrong>. La défense n'a rien de révolutionnaire : c'est la <strong>désobéissance<\u002Fstrong> / la <strong>résistance passive<\u002Fstrong>.<\u002Fli>\n<li><strong>ENTRETENIR la liberté<\u002Fstrong> = par l'<strong>étude<\u002Fstrong>, l'<strong>histoire<\u002Fstrong>, la <strong>mémoire<\u002Fstrong>, les <strong>livres<\u002Fstrong>, le <strong>savoir<\u002Fstrong>. L'amour naturel de la liberté <strong>s'émousse<\u002Fstrong> s'il n'est pas nourri par l'éducation. Les <strong>« mieux nés »<\u002Fstrong>, à « l'entendement net et l'esprit clairvoyant » (perfectionné par l'étude), gardent la liberté vivante en eux (→ <strong>texte 15<\u002Fstrong>). C'est pourquoi le <strong>Grand Turc<\u002Fstrong> entretient peu de gens savants : les <strong>livres<\u002Fstrong> rendent les hommes capables de <strong>haïr la tyrannie<\u002Fstrong>.<\u002Fli>\n<li><strong>L'écriture même<\u002Fstrong> est liberté : humaniste (références antiques à <strong>Homère/Ulysse<\u002Fstrong>, <strong>Virgile<\u002Fstrong>), digressive, fougueuse — éloge de la <strong>Pléiade<\u002Fstrong> et de la <strong>langue française<\u002Fstrong> (→ <strong>texte 16<\u002Fstrong>).<\u002Fli>\n<\u002Ful>\n<h3>Le texte complémentaire : La Fontaine, « Le Loup et le Chien » (texte 14)<\u002Fh3>\n<blockquote>\n<p><strong>Le pont parfait du parcours.<\u002Fstrong> Le <strong>Chien<\u002Fstrong> gras mais <strong>attaché<\u002Fstrong> = la <strong>servitude volontaire<\u002Fstrong> (il ne sent même plus son collier). Le <strong>Loup<\u002Fstrong> maigre mais <strong>libre<\u002Fstrong> = l'homme « mieux né » de La Boétie, qui « sent le poids du joug » et préfère la faim à la chaîne : <em>« Maître Loup s'enfuit, et court encor. »<\u002Fem> <strong>La liberté n'a pas de prix.<\u002Fstrong><\u002Fp>\n<\u002Fblockquote>\n<h1>PARTIE 3 — ANALYSE LINÉAIRE DES 16 TEXTES<\u002Fh1>\n<blockquote>\n<p><strong>Comment lire cette partie<\u002Fstrong> : pour chaque texte → une <strong>introduction à réciter<\u002Fstrong>, les <strong>mouvements<\u002Fstrong> (citation → procédé → effet), une <strong>conclusion + ouverture<\u002Fstrong>, la <strong>question de grammaire<\u002Fstrong> la plus probable.<\u002Fp>\n<\u002Fblockquote>\n<hr>\n<h2>OBJET 1 · POÉSIE — <em>Mes Forêts<\u002Fem> + Jammes<\u002Fh2>\n<h2>TEXTE 1 — Francis Jammes, <em>Le Deuil des primevères<\u002Fem> (1901), « Élégies » IV<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Francis Jammes (1868-1938) est un poète provincial du début du XX<sup>e<\u002Fsup> siècle, ami de Gide et de Claudel, marginal par rapport aux courants parisiens : il développe une poésie rurale ancrée dans le Pays basque, le \"jammisme\". Le recueil <em>Le Deuil des primevères<\u002Fem> (1901) mêle élégie et prière. Le poème étudié, \"Prière pour avoir foi dans la forêt\", est une élégie où le poète, désespéré, s'adresse à Dieu et cherche dans la nature un chemin vers la foi. <strong>Nous nous demanderons comment le poète passe du désespoir à l'espérance par le détour de la nature.<\u002Fstrong> Trois mouvements : vers 1 à 7, le poète désespéré se fond dans le paysage ; vers 8 à 16, l'ébauche d'une renaissance ; vers 17 à la fin, le tournant vers Dieu. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — v. 1-7 : le désespoir absorbé par le paysage<\u002Fstrong>\n- <strong>« Je n'espère plus rien, mon Dieu, je me résigne »<\u002Fstrong> → incipit-confession, <strong>présent d'énonciation<\u002Fstrong>, <strong>négation totale<\u002Fstrong> (ne… plus rien), <strong>apostrophe<\u002Fstrong> à Dieu : le ton élégiaque est posé d'emblée.\n- <strong>« Je me laisse aller comme la courbe des collines »<\u002Fstrong> → <strong>comparaison<\u002Fstrong> poète/nature + verbe pronominal de renoncement : il s'efface dans le paysage.\n- <strong>« Je sens la nuit en moi comme elle est sur les champs »<\u002Fstrong> → <strong>métaphore filée<\u002Fstrong> de l'extinction ; l'état intérieur = la nuit qui tombe.\n- <strong>« les faneuses d'azur / À travers la prairie des pensées de mon âme »<\u002Fstrong> → <strong>métaphore double du paysage intérieur<\u002Fstrong> : les pensées deviennent prairie.\n- Sonorités : <strong>assonances<\u002Fstrong> en [ɛ̃]/[ɑ̃] (« rien », « résigne », « champs ») = une plainte étouffée.<\u002Fp>\n<blockquote>\n<p><em>Bilan : le désespoir s'installe par fusion avec un paysage crépusculaire.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — v. 8-16 : l'ébauche d'une renaissance ambivalente<\u002Fstrong>\n- <strong>« Je voudrais être pareil au joli matin »<\u002Fstrong> → <strong>conditionnel de souhait<\u002Fstrong>, premier élan vers l'espoir.\n- <strong>« dans la rosée rose, se peignent les lapins »<\u002Fstrong> → <strong>homophonie<\u002Fstrong> « rosée rose », image enfantine, presque naïve : un bonheur simple.\n- <strong>« Je n'espère plus rien, mon Dieu, que le malheur »<\u002Fstrong> → <strong>reprise anaphorique<\u002Fstrong> du v.1, mais la <strong>restriction<\u002Fstrong> « que » fait du malheur la seule attente.\n- <strong>« cela me rend doux comme l'agriculteur / Qui suit patiemment la herse »<\u002Fstrong> → <strong>comparaison paysanne<\u002Fstrong>, allégorie de la <strong>résignation vertueuse<\u002Fstrong> : la douleur n'écrase plus, elle adoucit.\n- <strong>« Je suis abruti, mais c'est avec une grande douceur »<\u002Fstrong> → <strong>antithèse<\u002Fstrong> abruti/douceur : il accepte sa condition réduite.<\u002Fp>\n<blockquote>\n<p><em>Bilan : le désespoir devient acceptation, la nature commence à consoler.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — v. 17-26 : le tournant vers Dieu, la foi forestière<\u002Fstrong>\n- <strong>« Comme de grands morceaux de feuilles de silence »<\u002Fstrong> → <strong>synesthésie<\u002Fstrong> (le silence devient visible) : la forêt, écrin du recueillement.\n- <strong>« Mon Dieu, peut-être croirais-je à vous davantage / Si vous m'enleviez… »<\u002Fstrong> → <strong>conditionnel<\u002Fstrong> + <strong>subordonnée de condition<\u002Fstrong> + <strong>anaphore de « peut-être »<\u002Fstrong> : l'hypothèse d'une conversion.\n- <strong>« une chapelle bâtie en haut d'un arbre »<\u002Fstrong> → <strong>allégorie<\u002Fstrong> : la foi est <strong>dans la forêt même<\u002Fstrong>, fusion du sacré et du naturel.\n- <strong>« la chaleur glacée de la grande forêt »<\u002Fstrong> → <strong>oxymore<\u002Fstrong> : le mystère sacré.\n- <strong>« ils boiraient la fraîcheur du bénitier »<\u002Fstrong> → fusion finale nature/liturgie : les oiseaux participent au rite.<\u002Fp>\n<blockquote>\n<p><em>Bilan : la foi se trouve dans la forêt, devenue sanctuaire.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « Le poème suit une trajectoire en trois temps : du désespoir crépusculaire à une douceur résignée, puis à un horizon de foi. <strong>Réponse :<\u002Fstrong> le poète passe du désespoir à l'espérance en faisant de la nature elle-même un lieu sacré, par des métaphores qui dissolvent la frontière entre l'intérieur et l'extérieur, le profane et le sacré. <strong>Ouverture :<\u002Fstrong> cette spiritualisation de la forêt annonce directement <em>Mes Forêts<\u002Fem> de Dorion (texte 2), où la forêt devient espace de connaissance de soi. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« Je n'espère plus rien, mon Dieu, je me résigne. »<\u002Fem>\n« Deux <strong>propositions indépendantes juxtaposées<\u002Fstrong> par la virgule. La première est de <strong>forme négative<\u002Fstrong> : \"ne… plus\" est une négation <strong>aspectuelle<\u002Fstrong> (arrêt du procès), doublée du pronom indéfini négatif \"rien\" → négation <strong>totale<\u002Fstrong> et intensifiée. \"mon Dieu\" est une <strong>apostrophe<\u002Fstrong> (aucune fonction syntaxique). »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 2 — Hélène Dorion, <em>Mes Forêts<\u002Fem> (2021), « L'écorce incertaine », « L'aile »<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Hélène Dorion, poétesse québécoise née en 1958, est l'une des voix majeures de la poésie contemporaine. <em>Mes Forêts<\u002Fem> (2021) fait de la forêt un espace existentiel et symbolique. Le poème \"L'aile\" clôt la section \"L'écorce incertaine\" : il met en scène un mouvement d'élévation aussitôt brisé, qui devient matière à méditation. <strong>Nous nous demanderons quel lien s'établit entre la poétesse et la nature dans ce texte.<\u002Fstrong> Deux mouvements : vers 1 à 6, l'histoire tragique de l'oiseau ; vers 7 à la fin, l'interprétation poétique et la rêverie. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — v. 1-6 : l'histoire tragique de l'oiseau (un Icare miniature)<\u002Fstrong>\n- <strong>« L'aile / très haute / de la beauté »<\u002Fstrong> → <strong>vers ultra-courts<\u002Fstrong> (effet d'élévation graphique) + <strong>métonymie<\u002Fstrong> : l'aile pour l'oiseau, et pour la beauté.\n- <strong>« perce le brouillard de vivre »<\u002Fstrong> → <strong>métaphore<\u002Fstrong> : le « brouillard de vivre » = l'opacité de l'existence ; « perce » = transcendance.\n- <strong>« retombe entre les branches »<\u002Fstrong> → <strong>enjambement<\u002Fstrong> brutal qui mime la <strong>chute<\u002Fstrong> : le rêve d'élévation est brisé.\n- <strong>« l'animal saisit l'aile / qui gît au sol »<\u002Fstrong> → <strong>registre tragique<\u002Fstrong> : l'aile devient cadavre ; la beauté est dévorée.<\u002Fp>\n<blockquote>\n<p><em>Bilan : un mythe d'Icare en miniature — l'élan vers la beauté brisé par la pesanteur du réel.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — v. 7-14 : la méditation et l'intériorisation<\u002Fstrong>\n- <strong>« comme une mémoire difforme / de l'histoire »<\u002Fstrong> → <strong>comparaison<\u002Fstrong> : l'aile gisante devient symbole, trace d'un passé blessé.\n- <strong>« l'emporte loin / à l'intérieur du poème »<\u002Fstrong> → <strong>mise en abyme<\u002Fstrong> : le poème lui-même devient le lieu où la beauté se réfugie (réflexion sur la <em>poièsis<\u002Fem>, la création).\n- <strong>« la forêt rêve-t-elle »<\u002Fstrong> → <strong>personnification<\u002Fstrong> de la forêt + <strong>interrogation<\u002Fstrong> (sans point d'interrogation : une question qui plane). La nature devient sujet pensant.\n- <strong>« alors que j'avance / à petits pas »<\u002Fstrong> → présence du <strong>« je »<\u002Fstrong> poétique : la marche est une démarche <strong>initiatique<\u002Fstrong>, lente.\n- <strong>« de l'autre côté de la nuit »<\u002Fstrong> → <strong>métaphore<\u002Fstrong> : la traversée de la nuit = une quête de sens (formule-<strong>leitmotiv<\u002Fstrong> du recueil).<\u002Fp>\n<blockquote>\n<p><em>Bilan : poétesse et nature fusionnent dans la méditation — la beauté brisée trouve refuge dans le poème.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> le lien est une <strong>fusion méditative<\u002Fstrong>. L'aile brisée n'est pas qu'un objet du paysage : elle devient mémoire, image, rêve poétique. Dorion ne décrit pas la forêt, elle la <strong>pense<\u002Fstrong> et s'y <strong>pense<\u002Fstrong>. <strong>Ouverture :<\u002Fstrong> cette intériorisation de la nature se prolonge au texte 4 (\"Avant la nuit\") ; on peut aussi penser à Baudelaire (\"Correspondances\"), pour qui la nature est un \"temple\" où l'homme accède à un sens caché. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« la forêt rêve-t-elle / alors que j'avance / à petits pas »<\u002Fem>\n« Deux propositions. \"la forêt rêve-t-elle\" est une <strong>principale interrogative directe<\u002Fstrong> : <strong>inversion<\u002Fstrong> sujet-verbe avec pronom de reprise \"elle\" et le <strong>t euphonique<\u002Fstrong> (rêve-<strong>t<\u002Fstrong>-elle) ; interrogation <strong>totale<\u002Fstrong>. \"alors que j'avance à petits pas\" est une <strong>subordonnée circonstancielle de temps<\u002Fstrong> (conjonction \"alors que\") : elle pose le cadre temporel. L'absence de \"?\" est un <strong>choix esthétique<\u002Fstrong> (la question reste ouverte), mais la structure est bien interrogative. »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 3 — Hélène Dorion, <em>Mes Forêts<\u002Fem> (2021), « L'onde du chaos », « Il fait un temps de foudre et de lambeaux »<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Dans <em>Mes Forêts<\u002Fem> (2021), Dorion fait de la forêt un espace de méditation sur le monde et sur soi. Ce poème de la section \"L'onde du chaos\" interroge notre époque traversée par les crises. Le titre joue sur la <strong>polysémie<\u002Fstrong> de \"temps\" — à la fois <strong>météorologique<\u002Fstrong> et <strong>historique<\u002Fstrong>. <strong>Nous nous demanderons quel rôle la poésie peut jouer dans un monde en crise.<\u002Fstrong> Trois mouvements : vers 1 à 8, un temps en ruines ; vers 9 à 17, le lien avec l'actualité ; vers 18 à la fin, la solitude comme refuge. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — v. 1-8 : un temps en ruines<\u002Fstrong>\n- <strong>« Il fait un temps de foudre et de lambeaux »<\u002Fstrong> → <strong>structure impersonnelle<\u002Fstrong> \"il fait\" détournée ; <strong>polysémie<\u002Fstrong> de \"temps\" (climat/époque) : foudre et lambeaux disent la violence.\n- <strong>« d'arbres abattus / au-dedans de soi »<\u002Fstrong> → <strong>métaphore<\u002Fstrong> : ce sont les êtres qui sont \"abattus\" ; <strong>glissement<\u002Fstrong> de l'extérieur vers l'intérieur.\n- <strong>« il fait pluie maigre »<\u002Fstrong> → construction <strong>agrammaticale<\u002Fstrong> : l'<strong>ellipse<\u002Fstrong> mime l'épuisement de la langue.\n- <strong>« dans le labyrinthe des miroirs »<\u002Fstrong> → <strong>métaphore<\u002Fstrong> : on se perd en soi-même.\n- <strong>« le dos courbé   le poids des silences »<\u002Fstrong> → <strong>asyndète<\u002Fstrong> (blancs typographiques) : effet de pesanteur.<\u002Fp>\n<blockquote>\n<p><em>Bilan : un paysage intérieur de désastre et de dissolution.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — v. 9-17 : la crise du monde est une crise du langage<\u002Fstrong>\n- <strong>« guerres   famines   tristes duretés »<\u002Fstrong> → <strong>énumération asyndétique<\u002Fstrong>, rythme ternaire, <strong>absence de déterminants<\u002Fstrong> : la langue elle-même est essoufflée par le malheur.\n- <strong>« sur l'écran d'aujourd'hui / s'annoncent les orages de demain »<\u002Fstrong> → <strong>double sens d'« écran »<\u002Fstrong> : ce qui montre (TV, smartphone) ET ce qui fait barrage. L'écran éloigne du réel autant qu'il le montre (allusion au Covid, à l'actualité regardée sur écran).\n- <strong>« des chiffres pour ne rien dire / de l'inquiétude qui brûle nos mots »<\u002Fstrong> → critique du <strong>discours technocratique<\u002Fstrong> : les chiffres remplacent la parole humaine.\n- <strong>« bientôt cassées comme pib / nip fmi »<\u002Fstrong> → les <strong>acronymes<\u002Fstrong> (PIB, FMI, NIP) en minuscules, déstructurés = la <strong>défaite<\u002Fstrong> du langage poétique.<\u002Fp>\n<blockquote>\n<p><em>Bilan : le chaos du monde est aussi un chaos de la parole.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — v. 18-22 : la solitude comme refuge<\u002Fstrong>\n- <strong>« il fait un temps à s'enfermer »<\u002Fstrong> → <strong>reprise<\u002Fstrong> du \"il fait\", désormais comme <strong>invitation au retrait<\u002Fstrong>.\n- <strong>« dans nos maisons de forêt »<\u002Fstrong> → <strong>métaphore<\u002Fstrong> : retour à un habitat naturel et symbolique (la cabane, <em>Walden<\u002Fem>).\n- <strong>« avec le bruit secret des nuages / qui souffle / de l'autre côté de la nuit »<\u002Fstrong> → <strong>synesthésie<\u002Fstrong> + <strong>personnification<\u002Fstrong> ; \"de l'autre côté de la nuit\" (<strong>leitmotiv<\u002Fstrong>) = l'horizon nouveau à conquérir par la poésie. <strong>Antithèse<\u002Fstrong> « temps de foudre » / « bruit secret ».<\u002Fp>\n<blockquote>\n<p><em>Bilan : la poésie devient l'abri où renaître après le chaos.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> la poésie joue le rôle d'une <strong>résistance silencieuse<\u002Fstrong>. Face au bavardage technocratique des chiffres, elle restaure une parole intime, capable d'écouter \"le bruit secret des nuages\". <strong>Ouverture :<\u002Fstrong> ce retrait dans la forêt rappelle <em>Walden<\u002Fem> de Thoreau ou le film <em>Into the Wild<\u002Fem> ; il répond aussi au texte 4 où la marche poétique convoque toute une lignée d'écrivains. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« il fait un temps à s'enfermer / dans nos maisons de forêt »<\u002Fem>\n« Phrase de type <strong>déclaratif<\u002Fstrong> et de <strong>forme impersonnelle<\u002Fstrong> : \"il\" est un <strong>pronom impersonnel<\u002Fstrong> (non remplaçable par un sujet réel), structure \"il fait + nom de temps\" typique des constructions <strong>météorologiques<\u002Fstrong>. Suit une <strong>proposition subordonnée infinitive<\u002Fstrong> \"à s'enfermer\" : l'infinitif est introduit par la préposition \"à\" et exprime une <strong>finalité<\u002Fstrong> (un temps qui invite à s'enfermer). »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 4 — Hélène Dorion, <em>Mes Forêts<\u002Fem> (2021), « Le bruissement du temps », « Avant la nuit » (v. 73-98)<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Dans la dernière section de <em>Mes Forêts<\u002Fem>, \"Le bruissement du temps\", Dorion réfléchit au sens de l'humanité à travers une <strong>lignée d'écrivains<\u002Fstrong>. \"Avant la nuit\" les convoque comme des compagnons de marche. Le passage (v. 73-98) clôt la section et le recueil. <strong>Nous nous demanderons si l'évocation de cette communauté littéraire annonce la fin de la poésie ou, au contraire, un commencement.<\u002Fstrong> Trois mouvements : la convocation des grands écrivains ; le bilan d'un cheminement intérieur ; la mission infinie de la poésie. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — la convocation d'une lignée (la nuit, le rêve, l'intertextualité)<\u002Fstrong>\n- <strong>« la nuit s'approfondit / et l'on se met à rêver »<\u002Fstrong> → la nuit, moment privilégié de la <strong>rêverie<\u002Fstrong> ; le pronom indéfini <strong>« on »<\u002Fstrong> crée une communauté.\n- <strong>« du haut des falaises de Rilke / dans la forêt de Dante »<\u002Fstrong> → <strong>intertextualité<\u002Fstrong> (Rilke, Dante et sa \"forêt obscure\") : la poésie héritée comme paysage intérieur.\n- <strong>« on voit le passé / déjà   on lit le futur »<\u002Fstrong> → <strong>parallélisme<\u002Fstrong> voir/lire, passé/futur : la littérature <strong>traverse les époques<\u002Fstrong>.\n- <strong>« on traverse le bois de Walden… d'Hopkins   les clairières de Zambrano »<\u002Fstrong> → <strong>énumération<\u002Fstrong> de références mondiales (Thoreau, Zanzotto, Hopkins, Zambrano) : la poésie est <strong>universelle<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : une communauté de poètes traverse le temps et les frontières.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — le bilan d'un cheminement intérieur<\u002Fstrong>\n- <strong>« vers la connaissance de soi »<\u002Fstrong> → tous ces auteurs convergent vers une même <strong>quête<\u002Fstrong>.\n- <strong>« on a marché   on s'est plongé / dans le long travail de l'amour »<\u002Fstrong> → <strong>passé composé<\u002Fstrong> + <strong>asyndète<\u002Fstrong> + <strong>métaphore<\u002Fstrong> : la connaissance de soi est un travail patient.\n- <strong>« on a trébuché / rebondi   puis chuté de nouveau »<\u002Fstrong> → <strong>gradation<\u002Fstrong> des échecs : le chemin est fait de chutes.<\u002Fp>\n<blockquote>\n<p><em>Bilan : un chemin initiatique, non linéaire, fait d'épreuves.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — la mission infinie de la poésie<\u002Fstrong>\n- <strong>« le temps jamais ne s'arrête / nous dit l'arbre / nous dit la forêt »<\u002Fstrong> → <strong>maxime<\u002Fstrong> (vérité générale) + <strong>personnification<\u002Fstrong> de la nature + <strong>anaphore<\u002Fstrong> \"nous dit\" : c'est la nature qui <strong>enseigne<\u002Fstrong> à l'homme.\n- <strong>« sur la branche du présent / un poème murmure »<\u002Fstrong> → <strong>métaphore<\u002Fstrong> de la branche (fragilité <strong>et<\u002Fstrong> naissance) + personnification du poème.\n- <strong>« un chemin vaste et lumineux / qui donne sens / à ce qu'on appelle humanité »<\u002Fstrong> → <strong>antithèse<\u002Fstrong> vaste/lumineux + <strong>chute<\u002Fstrong> : la poésie est ce qui <strong>donne sens à l'humain<\u002Fstrong> — sa mission ultime.<\u002Fp>\n<blockquote>\n<p><em>Bilan : la poésie est un commencement perpétuel.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse : ce n'est pas une fin mais un commencement.<\u002Fstrong> Malgré les crises (texte 3), malgré les chutes, la poésie continue ; elle est ce \"chemin vaste et lumineux\" qui donne sens à l'humain. <strong>Ouverture :<\u002Fstrong> on retrouve cette foi chez Francis Ponge, ou chez Yves Bonnefoy (\"La poésie, c'est ce qui reste à dire quand on a tout dit\"). »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« le temps jamais ne s'arrête / nous dit l'arbre »<\u002Fem>\n« Deux propositions. \"le temps jamais ne s'arrête\" est une <strong>principale négative<\u002Fstrong> : l'adverbe <strong>\"jamais\"<\u002Fstrong> porte la négation (renforcé par \"ne\"), <strong>antéposé<\u002Fstrong> au verbe pour le mettre en relief. \"nous dit l'arbre\" est une <strong>principale juxtaposée<\u002Fstrong>, sans coordonnant, avec <strong>inversion sujet-verbe<\u002Fstrong> (sujet \"l'arbre\" postposé) typique des <strong>incises<\u002Fstrong> ; \"nous\" est un pronom personnel <strong>COI<\u002Fstrong> antéposé (= \"à nous\"). »<\u002Fp>\n<\u002Fblockquote>\n<h2>OBJET 2 · THÉÂTRE — <em>Pour un oui ou pour un non<\u002Fem> + Molière<\u002Fh2>\n<h2>TEXTE 5 — Nathalie Sarraute, <em>Pour un oui ou pour un non<\u002Fem> (1982), incipit<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Nathalie Sarraute (1900-1999) est une autrice majeure du Nouveau Roman et du théâtre contemporain. Son œuvre tourne autour des <strong>tropismes<\u002Fstrong> : ces mouvements intérieurs imperceptibles qui régissent en secret les rapports humains. <em>Pour un oui ou pour un non<\u002Fem> (1982) met en scène la fissure d'une amitié entre deux hommes, H1 et H2, à cause d'une parole presque indicible. Le passage étudié est l'incipit. <strong>Nous nous demanderons comment cet incipit installe une crise d'amitié à partir d'un non-dit.<\u002Fstrong> Trois mouvements : lignes 1 à 8, l'ouverture <em>in medias res<\u002Fem> ; lignes 9 à 19, le détour par le passé ; lignes 20 à la fin, l'approche du nœud. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — l. 1-8 : ouverture <em>in medias res<\u002Fem><\u002Fstrong>\n- <strong>« Écoute, je voulais te demander… »<\u002Fstrong> → <strong>impératif d'attaque<\u002Fstrong> + <strong>imparfait<\u002Fstrong> d'atténuation + <strong>aposiopèse<\u002Fstrong> (…) : la difficulté à dire est là dès le premier mot.\n- <strong>« que s'est-il passé ? Qu'est-ce que tu as contre moi ? »<\u002Fstrong> → <strong>interrogation directe<\u002Fstrong> brutale : H1 se pose en <strong>victime accusatrice<\u002Fstrong>.\n- <strong>« Mais rien… Pourquoi ? »<\u002Fstrong> → <strong>négation totale<\u002Fstrong> \"rien\" + question d'esquive : H2 feint l'incompréhension.\n- <strong>« tu ne fais plus jamais signe… il faut toujours que ce soit moi »<\u002Fstrong> → <strong>double négation<\u002Fstrong> (ne… plus jamais) + <strong>modalisateur<\u002Fstrong> \"il faut\" : l'ami abandonné.<\u002Fp>\n<blockquote>\n<p><em>Bilan : le rapport tropismique est posé — H1 cherche à faire dire, H2 résiste.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — l. 9-19 : le détour par le passé (fausse harmonie)<\u002Fstrong>\n- <strong>« il n'y a jamais rien eu entre nous… rien dont je me souvienne »<\u002Fstrong> → <strong>double négation<\u002Fstrong> + <strong>aposiopèse<\u002Fstrong> : l'effort de se rassurer trahit le doute.\n- <strong>« il y a des choses que je n'oublie pas »<\u002Fstrong> → <strong>litote<\u002Fstrong> (= je me souviens très bien) : inquiétant.\n- <strong>« Tu te souviens comme on attendrissait ta mère ? »<\u002Fstrong> → souvenir d'enfance <strong>idéalisé<\u002Fstrong>, mais l'évocation de la mère est <strong>piégée<\u002Fstrong>.\n- <strong>« \"Ah lui, au moins, c'est un vrai copain, tu pourras toujours compter sur lui.\" »<\u002Fstrong> → <strong>discours direct rapporté<\u002Fstrong> : la mère présente l'amitié comme un <strong>ordre<\u002Fstrong>, une assignation.\n- <strong>« C'est ce que j'ai fait, d'ailleurs. »<\u002Fstrong> → réponse <strong>glaciale<\u002Fstrong>, le \"d'ailleurs\" cassant : H2 a fait son devoir, point.<\u002Fp>\n<blockquote>\n<p><em>Bilan : la fausse harmonie du passé prépare le retournement.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — l. 20-fin : l'approche du nœud<\u002Fstrong>\n- <strong>« tu étais à l'autre bout du monde »<\u002Fstrong> → <strong>hyperbole<\u002Fstrong> spatiale = la distance affective.\n- <strong>« Mais moi aussi, figure-toi… »<\u002Fstrong> (<em>dans un élan<\u002Fem>) → la <strong>didascalie<\u002Fstrong> signale l'aveu malgré soi : H2 admet enfin qu'il y a quelque chose.\n- <strong>« Non… vraiment rien… Rien qu'on puisse dire… »<\u002Fstrong> → <strong>triple \"rien\"<\u002Fstrong> + aposiopèses + <strong>proposition relative<\u002Fstrong> \"qu'on puisse dire\" : ce n'est pas qu'il n'y a rien, c'est que cela est <strong>indicible<\u002Fstrong>. C'est <strong>exactement le tropisme<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : la scène culmine sur \"rien qu'on puisse dire\", formule de toute la poétique sarrautienne.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> Sarraute installe la crise sur <strong>ce qui ne peut se dire<\u002Fstrong> : aposiopèses et hésitations deviennent le moteur du dialogue. La crise n'a pas d'objet, elle est dans la <strong>friction des sensibilités<\u002Fstrong>. <strong>Ouverture :<\u002Fstrong> ce théâtre de l'indicible contraste avec celui de Molière (texte 6), où Alceste exprime la rupture en alexandrins clairs et publics — le <em>dicible<\u002Fem> classique contre l'<em>indicible<\u002Fem> moderne. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« Je voudrais savoir ce qu'il s'est passé. »<\u002Fem>\n« <strong>Interrogation indirecte.<\u002Fstrong> Principale \"Je voudrais savoir\" (verbe de connaissance) ; subordonnée <strong>interrogative indirecte<\u002Fstrong> \"ce qu'il s'est passé\", introduite par le pronom interrogatif \"ce que\". Elle est <strong>partielle<\u002Fstrong> (réponse = une information). Trois marques : pas de \"?\", pas d'inversion, pas de \"est-ce que\". Forme directe : <em>Que s'est-il passé ?<\u002Fem> »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 6 — Molière, <em>Le Misanthrope<\u002Fem> (1666), Acte I, scène 1, vers 1-35<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Molière (1622-1673), maître de la comédie classique, écrit en 1666 <em>Le Misanthrope<\u002Fem>, \"grande comédie\" en cinq actes et en vers qui interroge la place de la sincérité dans une société mondaine régie par la politesse de surface. La pièce s'ouvre <em>in medias res<\u002Fem> sur une dispute entre <strong>Alceste<\u002Fstrong>, le misanthrope intransigeant, et <strong>Philinte<\u002Fstrong>, son ami modéré. <strong>Nous nous demanderons comment Molière met en scène, dès l'ouverture, le conflit entre exigence morale et bienséance mondaine.<\u002Fstrong> Trois mouvements : vers 1 à 13, la rupture brutale ; vers 14 à 28, la tirade morale ; vers 29 à 35, l'ironie de Philinte. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — v. 1-13 : la déclaration de rupture<\u002Fstrong>\n- <strong>« Qu'est-ce donc ? Qu'avez-vous ? »<\u002Fstrong> → <strong>stichomythie<\u002Fstrong> vive, double <strong>interrogation directe<\u002Fstrong> de Philinte.\n- <strong>« Laissez-moi, je vous prie » / « courez vous cacher »<\u002Fstrong> → <strong>impératifs<\u002Fstrong> + <strong>hyperbole<\u002Fstrong> : Alceste refuse jusqu'à la conversation.\n- <strong>« Moi, je veux me fâcher, et ne veux point entendre »<\u002Fstrong> → <strong>parallélisme<\u002Fstrong> + <strong>emphase<\u002Fstrong> du \"moi\" : Alceste se définit par le refus.\n- <strong>« Moi, votre ami ? Rayez cela de vos papiers. »<\u002Fstrong> → <strong>question oratoire<\u002Fstrong> indignée + <strong>métaphore administrative<\u002Fstrong> : il raye publiquement l'amitié.\n- <strong>« Et ne veux nulle place en des cœurs corrompus »<\u002Fstrong> → <strong>métaphore<\u002Fstrong> morale : Alceste se pose en <strong>juge<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : Alceste, personnage fermé, brutal, presque tyrannique.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — v. 14-28 : la grande tirade morale<\u002Fstrong>\n- <strong>« Allez, vous devriez mourir de pure honte »<\u002Fstrong> → <strong>hyperbole<\u002Fstrong> : le verbe \"mourir\" dramatise la faute.\n- <strong>« tout homme d'honneur s'en doit scandaliser »<\u002Fstrong> → <strong>généralisation<\u002Fstrong> + <strong>lexique judiciaire<\u002Fstrong> : un <strong>verdict<\u002Fstrong> moral.\n- <strong>« Je vous vois accabler un homme de caresses… les dernières tendresses »<\u002Fstrong> → <strong>lexique amoureux détourné<\u002Fstrong> + <strong>ironie<\u002Fstrong> : ces marques sont disproportionnées.\n- <strong>« À peine pouvez-vous dire comme il se nomme »<\u002Fstrong> → <strong>chute comique<\u002Fstrong> : Philinte ne connaît même pas le nom de l'inconnu embrassé.\n- <strong>« Morbleu, c'est une chose indigne, lâche, infâme »<\u002Fstrong> → <strong>juron<\u002Fstrong> + <strong>gradation<\u002Fstrong> ternaire : le paroxysme.<\u002Fp>\n<blockquote>\n<p><em>Bilan : Alceste érige un tribunal moral où la sociabilité ordinaire devient un crime.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — v. 29-35 : l'ironie de Philinte<\u002Fstrong>\n- <strong>« Je ne vois pas, pour moi, que le cas soit pendable »<\u002Fstrong> → Philinte <strong>reprend la métaphore<\u002Fstrong> d'Alceste pour la désamorcer.\n- <strong>« Et ne me pende pas pour cela, s'il vous plaît »<\u002Fstrong> → <strong>politesse glaciale<\u002Fstrong> qui retourne l'absurdité contre Alceste.\n- <strong>« Mais, sérieusement, que voulez-vous qu'on fasse ? »<\u002Fstrong> → <strong>interrogation rhétorique<\u002Fstrong> : c'est le début du <strong>grand débat<\u002Fstrong> de la pièce (comment vivre en société ?).<\u002Fp>\n<blockquote>\n<p><em>Bilan : Philinte désamorce par l'ironie et ouvre le vrai sujet.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> Molière met en scène le conflit par un <strong>face-à-face<\u002Fstrong> de deux postures : Alceste dans le registre <strong>tragique du verdict<\u002Fstrong>, Philinte dans le registre <strong>comique de l'ironie<\u002Fstrong>. La scène d'exposition installe le dilemme central : faut-il être sincère au risque de l'inadaptation sociale ? <strong>Ouverture :<\u002Fstrong> on retrouve cette exigence de comptes chez Sarraute (texte 5), mais sur un objet <em>indicible<\u002Fem>. De Molière à Sarraute, la dispute amicale devient le ressort d'un théâtre qui interroge l'humanité. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« Moi, je veux me fâcher, et ne veux point entendre. »<\u002Fem>\n« Deux <strong>propositions indépendantes coordonnées<\u002Fstrong> par \"et\". La seconde, \"ne veux point entendre\", est de <strong>forme négative<\u002Fstrong> : \"ne… point\", forme <strong>soutenue et classique<\u002Fstrong> de \"ne… pas\" (XVII<sup>e<\u002Fsup>), négation <strong>totale<\u002Fstrong>. La première présente une <strong>emphase par dislocation<\u002Fstrong> à gauche : \"Moi, je\" met en relief le pronom pour insister sur l'identité d'Alceste. »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 7 — Nathalie Sarraute, <em>Pour un oui ou pour un non<\u002Fem> (1982), « Oui, il me semble… »<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Dans <em>Pour un oui ou pour un non<\u002Fem> (1982), la fissure de l'amitié entre H1 et H2 progresse en spirale. Le passage intervient au cœur de la pièce : les deux personnages ont enfin formulé leurs sensibilités opposées et envisagent la rupture. <strong>Nous nous demanderons si cette scène apporte une véritable résolution à la dispute, ou si elle en révèle l'impossibilité.<\u002Fstrong> Quatre mouvements : sensibilités incompatibles ; idée d'une rupture ; le \"surmoi social\" qui l'empêche ; la chute ouverte sur \"oui / non\". »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — sensibilités incompatibles<\u002Fstrong>\n- <strong>« il me semble que là où tu es tout est… inconsistant, fluctuant… »<\u002Fstrong> → <strong>modalisateur<\u002Fstrong> + <strong>aposiopèse<\u002Fstrong> : difficulté à nommer le tropisme.\n- <strong>« des sables mouvants où l'on s'enfonce »<\u002Fstrong> → <strong>métaphore filée<\u002Fstrong> : chez l'autre, on perd pied.\n- <strong>« comme de la claustrophobie… des compartiments, des cloisons, des étages »<\u002Fstrong> → <strong>comparaison symétrique inversée<\u002Fstrong> + <strong>énumération<\u002Fstrong> : chez H1, H2 étouffe. <strong>Ni l'un ni l'autre n'a tort.<\u002Fstrong>\n- <strong>« cette pulsation, un pouls qui se remet à battre »<\u002Fstrong> → <strong>métaphore médicale<\u002Fstrong> : retrouver le pouls = se retrouver soi.<\u002Fp>\n<blockquote>\n<p><em>Bilan : deux mondes incompatibles, dits par des métaphores spatiales et corporelles.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — l'idée d'une rupture<\u002Fstrong>\n- <strong>« À quoi bon s'acharner ? »<\u002Fstrong> → <strong>question rhétorique<\u002Fstrong> : constat de l'impasse.\n- <strong>« Ce serait tellement plus sain… plus salutaire… La meilleure solution… »<\u002Fstrong> → <strong>conditionnel<\u002Fstrong> + <strong>stichomythies<\u002Fstrong> en aposiopèses : ils rêvent une rupture \"saine\".<\u002Fp>\n<blockquote>\n<p><em>Bilan : la rupture apparaît un instant comme un soulagement.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — le \"surmoi social\"<\u002Fstrong>\n- <strong>« même toi, tu n'as pas osé le prendre sur toi » / « J'ai besoin qu'on m'autorise. »<\u002Fstrong> → <strong>négation<\u002Fstrong> + phrase courte terrible : ils ne sont pas <strong>autonomes<\u002Fstrong>.\n- <strong>« si on introduisait une demande… à nous deux »<\u002Fstrong> → <strong>métaphore administrative<\u002Fstrong> : la rupture comme <strong>procédure<\u002Fstrong>.\n- <strong>« Eh bien, de quoi s'agit-il encore ?… Quelles taupes ? Quelles pelouses ? Quels sables mouvants ? »<\u002Fstrong> → <strong>discours rapporté<\u002Fstrong> des \"gens\" (la société) : H2 imagine leurs questions moqueuses.\n- <strong>« déboutés tous les deux »<\u002Fstrong> → <strong>lexique judiciaire<\u002Fstrong> : la société les <strong>déboute<\u002Fstrong>, comme un tribunal.<\u002Fp>\n<blockquote>\n<p><em>Bilan : un \"surmoi social\" interdit la rupture faute de raison \"sérieuse\".<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 4 — la chute ouverte<\u002Fstrong>\n- <strong>« ils peuvent rompre pour un oui ou pour un non »<\u002Fstrong> → le <strong>titre<\u002Fstrong> de la pièce <strong>révélé<\u002Fstrong> : la rupture n'a pas de cause rationnelle.\n- <strong>« Ce n'est pourtant pas la même chose… » / « Oui. / Non ! »<\u002Fstrong> → la dispute se <strong>réduit à deux syllabes<\u002Fstrong> : le langage <strong>capitule<\u002Fstrong> devant l'indicible.<\u002Fp>\n<blockquote>\n<p><em>Bilan : aucune résolution — l'incompatibilité est existentielle.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> la scène ne résout rien ; elle révèle que la rupture est <strong>inévitable<\u002Fstrong>, non par méchanceté, mais par <strong>incompatibilité fondamentale<\u002Fstrong>. On peut rompre \"pour un oui ou pour un non\" parce que certaines différences sont irréconciliables. <strong>Ouverture :<\u002Fstrong> cette même intuition (un détail minuscule qui fait tout basculer) traverse <em>Art<\u002Fem> de Yasmina Reza — mais Reza, elle, imagine une réconciliation possible. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« À quoi bon s'acharner ? »<\u002Fem>\n« Phrase de type <strong>interrogatif<\u002Fstrong> (interrogation <strong>directe partielle<\u002Fstrong>, introduite par le groupe interrogatif \"À quoi bon\"), à valeur <strong>rhétorique<\u002Fstrong> (elle n'attend pas de réponse mais affirme l'inutilité). Construction <strong>elliptique<\u002Fstrong> et <strong>infinitive<\u002Fstrong> : pas de verbe conjugué, le noyau est l'infinitif \"s'acharner\". »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 8 — Nathalie Sarraute, <em>Pour un oui ou pour un non<\u002Fem> (1982), « Non, ne riez pas » (la souricière)<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Cette scène introduit deux personnages secondaires (H3 et F) et confronte H2 au <strong>regard social<\u002Fstrong>. H2 raconte comment il s'est senti \"pris au piège\" dans un jeu de hiérarchie sociale, après une remarque condescendante sur sa promotion. <strong>Nous nous demanderons comment Sarraute dénonce les mécanismes d'assujettissement social à travers la métaphore de la souricière.<\u002Fstrong> Trois mouvements : le récit de la souricière ; l'humiliation et le regard de l'autre ; l'incompréhension des témoins. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — le récit de la souricière<\u002Fstrong>\n- <strong>« je pouvais reculer… Ou alors je pouvais me laisser tenter, m'approcher de l'appât, le mordre »<\u002Fstrong> → <strong>alternative binaire<\u002Fstrong> + <strong>métaphore animale<\u002Fstrong> : H2 se décrit en <strong>proie<\u002Fstrong>.\n- <strong>« je me suis installé tout au fond de la cage »<\u002Fstrong> → <strong>métaphore filée de la cage<\u002Fstrong> : H2 y entre <strong>volontairement<\u002Fstrong> — exactement comme <strong>le peuple de La Boétie<\u002Fstrong> (servitude volontaire !).\n- <strong>« J'ai joué le jeu qu'on y joue. Conformément à toutes les règles. »<\u002Fstrong> → <strong>ironie<\u002Fstrong> : se conformer parfaitement est précisément ce qui le <strong>dégrade<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : l'aliénation est consentie — H2 tend lui-même le piège.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — l'humiliation et le regard de l'autre<\u002Fstrong>\n- <strong>« Il m'a tenu dans le creux de sa main, il m'a examiné »<\u002Fstrong> → <strong>métaphore<\u002Fstrong> de la domination : rapport de force total.\n- <strong>« Voyez-vous ça, regardez-moi ce bonhomme »<\u002Fstrong> → <strong>discours intérieur du dominant<\u002Fstrong> : H2 <strong>intériorise<\u002Fstrong> le jugement.\n- <strong>« C'est biiien… ça… »<\u002Fstrong> → <strong>allongement graphique<\u002Fstrong> de la voyelle : la condescendance transcrite, <strong>ironie cruelle<\u002Fstrong> (écho de la phrase-déclencheur de toute la pièce).<\u002Fp>\n<blockquote>\n<p><em>Bilan : H2 se voit avec les yeux méprisants de l'autre.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — l'incompréhension des témoins<\u002Fstrong>\n- <strong>« Pas grand chose, en effet. »<\u002Fstrong> (H3) → <strong>réponse plate<\u002Fstrong> : les autres ne perçoivent pas la subtilité de sa souffrance.\n- <strong>« ne vaudrait-il pas mieux… »<\u002Fstrong> (F) → <strong>suggestion implicite<\u002Fstrong> d'un trouble : H2 renvoyé à sa singularité.\n- <strong>« Non, ne craignez rien. Laissez-nous, je m'en charge. »<\u002Fstrong> (H1) → H1 <strong>prend en charge<\u002Fstrong> H2 : relation de <strong>dépendance<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : H2 reste seul, incompris, dépendant de H1.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> Sarraute montre que la société fonctionne comme une <strong>souricière dont les victimes tendent elles-mêmes le piège<\u002Fstrong>. L'aliénation n'est pas imposée : elle est <strong>consentie<\u002Fstrong>. <strong>Ouverture :<\u002Fstrong> ce mécanisme rejoint directement le <em>Discours de la servitude volontaire<\u002Fem> de La Boétie (objet 4), où les hommes \"servent\" un tyran qui n'a de pouvoir que celui qu'ils lui donnent. La cage de H2, c'est la servitude volontaire mise en scène. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« Non, ne riez pas. Il parle sérieusement, je vous assure. »<\u002Fem>\n« \"ne riez pas\" est une phrase de type <strong>impératif<\u002Fstrong> (injonctif), de <strong>forme négative<\u002Fstrong> : négation <strong>totale<\u002Fstrong> \"ne… pas\" encadrant le verbe à l'impératif \"riez\". La phrase suivante juxtapose deux <strong>propositions indépendantes<\u002Fstrong> (\"Il parle sérieusement\" / \"je vous assure\") : la seconde est une <strong>incise<\u002Fstrong> d'assertion. »<\u002Fp>\n<\u002Fblockquote>\n<h2>OBJET 3 · ROMAN — <em>Manon Lescaut<\u002Fem> + Breton<\u002Fh2>\n<h2>TEXTE 9 — Abbé Prévost, <em>Manon Lescaut<\u002Fem> (1731), « Avis de l'auteur »<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « L'Abbé Prévost (1697-1763) est un romancier du XVIII<sup>e<\u002Fsup> siècle, figure du libertin repenti. <em>Manon Lescaut<\u002Fem> (1731) s'inscrit dans une série plus large, les <em>Mémoires d'un homme de qualité<\u002Fem>. Cet \"Avis de l'auteur\" est une <strong>préface<\u002Fstrong> qui justifie la valeur <strong>morale<\u002Fstrong> du roman. <strong>Nous nous demanderons comment Prévost construit une défense du roman comme outil d'éducation morale en partant du paradoxe de la condition humaine.<\u002Fstrong> Trois mouvements : le paradoxe moral ; l'explication (les préceptes sont trop vagues) ; la justification du roman par l'exemple. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — le paradoxe moral de l'homme<\u002Fstrong>\n- <strong>« estimés et négligés »<\u002Fstrong> → <strong>antithèse<\u002Fstrong> : les préceptes moraux sont connus et pourtant ignorés.\n- <strong>« cette bizarrerie du cœur humain »<\u002Fstrong> → <strong>périphrase<\u002Fstrong> : l'homme est irrationnel ; regard quasi <strong>psychologique<\u002Fstrong>.\n- <strong>« Les plus doux moments de leur vie… à s'entretenir des charmes de la vertu »<\u002Fstrong> → <strong>ironie douce<\u002Fstrong> : parler de vertu est doux, mais agir vertueusement est difficile.<\u002Fp>\n<blockquote>\n<p><em>Bilan : un paradoxe fondamental — on aime le bien, on fait le mal.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — l'explication : la morale abstraite ne suffit pas<\u002Fstrong>\n- <strong>« tous les préceptes de la morale n'étant que des principes vagues et généraux »<\u002Fstrong> → <strong>argumentation directe<\u002Fstrong> : la morale abstraite ne s'applique pas au concret.\n- <strong>« En est-ce réellement l'occasion ? Sait-on bien quelle en doit être la mesure ? »<\u002Fstrong> → <strong>questions rhétoriques accumulées<\u002Fstrong> : l'homme est <strong>paralysé<\u002Fstrong> par le doute au moment d'agir.\n- <strong>« On craint de devenir dupe en voulant être bienfaisant »<\u002Fstrong> → <strong>ironie sociale<\u002Fstrong> : la générosité est suspecte.<\u002Fp>\n<blockquote>\n<p><em>Bilan : critique de la morale abstraite au profit d'une morale vécue.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — la justification du roman<\u002Fstrong>\n- <strong>« il n'y a que l'expérience ou l'exemple qui puisse déterminer… le penchant du cœur »<\u002Fstrong> → <strong>thèse centrale<\u002Fstrong> : la vraie morale = l'expérience ou l'exemple raconté.\n- <strong>« l'expérience n'est point un avantage qu'il soit libre à tout le monde de se donner »<\u002Fstrong> → argument de <strong>démocratisation<\u002Fstrong> : tous ne peuvent tout vivre ; le roman pallie cette inégalité.\n- <strong>« Chaque fait… est un degré de lumière, une instruction qui supplée à l'expérience »<\u002Fstrong> → <strong>métaphore de la lumière<\u002Fstrong> : le roman <strong>instruit<\u002Fstrong>.\n- <strong>« un traité de morale réduit agréablement en exercices »<\u002Fstrong> → <strong>formule célèbre<\u002Fstrong>, quasi <strong>oxymore<\u002Fstrong> élégant : le roman est à la fois <strong>plaisir et leçon<\u002Fstrong> (<em>placere et docere<\u002Fem>).<\u002Fp>\n<blockquote>\n<p><em>Bilan : le roman enseigne par l'exemple ce que la morale abstraite ne peut pas enseigner.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> Prévost retourne le reproche qu'on pourrait lui faire (écrire une histoire de débauche) en <strong>argument<\u002Fstrong> : c'est précisément parce que l'histoire de Des Grieux montre les <strong>conséquences<\u002Fstrong> de la passion qu'elle est moralement utile. <strong>Ouverture :<\u002Fstrong> cette défense du romanesque comme apprentissage éclaire tout le parcours \"Personnages en marge, plaisirs du romanesque\" — et trouve un écho ironique chez Breton (texte 12), qui revendique au contraire le roman du <strong>hasard<\u002Fstrong> et du <strong>merveilleux<\u002Fstrong>. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« il n'y a que l'expérience ou l'exemple qui puisse déterminer… le penchant du cœur. »<\u002Fem>\n« <strong>Forme négative restrictive<\u002Fstrong> : \"ne… que\" (= seulement) ; ce n'est <strong>pas<\u002Fstrong> une vraie négation, elle <strong>restreint<\u002Fstrong> (seuls l'expérience ou l'exemple le peuvent). Suit une <strong>subordonnée relative<\u002Fstrong> \"qui puisse déterminer…\", introduite par le pronom relatif <strong>\"qui\"<\u002Fstrong> (sujet), antécédent \"l'expérience ou l'exemple\" ; le <strong>subjonctif<\u002Fstrong> \"puisse\" marque la restriction/l'éventualité. »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 10 — Abbé Prévost, <em>Manon Lescaut<\u002Fem> (1731), Première partie — l'évasion de Saint-Lazare<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Dans cet extrait de la première partie, Des Grieux s'échappe de Saint-Lazare, maison de correction où son père l'a enfermé pour le séparer de Manon. Il prend en otage le Père supérieur et blesse mortellement un domestique. <strong>Nous nous demanderons comment Prévost fait de cette évasion un révélateur du caractère de Des Grieux et de sa conception de la liberté.<\u002Fstrong> Trois mouvements : la prise d'otage ; la fuite haletante ; le coup de feu et l'ironie finale. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — la prise d'otage : une rhétorique de la violence policée<\u002Fstrong>\n- <strong>« la liberté étant le plus cher de tous les biens »<\u002Fstrong> → <strong>déclaration solennelle<\u002Fstrong> : la liberté en valeur absolue — mais ici, pour rejoindre Manon, non par idéal.\n- <strong>« je lui fis voir une honnête raison de silence, que je tenais sur mon justaucorps »<\u002Fstrong> → <strong>euphémisme<\u002Fstrong> quasi <strong>comique<\u002Fstrong> : le pistolet devient \"honnête raison\" — Des Grieux nomme sa violence avec élégance.\n- <strong>« À Dieu ne plaise ! […] mais je veux être libre »<\u002Fstrong> → <strong>distinction<\u002Fstrong> + résolution : il nie vouloir tuer mais <strong>menace<\u002Fstrong> quand même.<\u002Fp>\n<blockquote>\n<p><em>Bilan : un héros élégant et cynique, qui euphémise sa propre violence.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — la fuite haletante<\u002Fstrong>\n- <strong>« À mesure que nous avancions… il me répétait avec un soupir : \"Ah ! mon fils\" »<\u002Fstrong> → <strong>rythme de l'avancée<\u002Fstrong> + <strong>discours direct<\u002Fstrong> : le désespoir du Père contraste avec la froideur de Des Grieux.\n- <strong>« Point de bruit, mon père »<\u002Fstrong> → <strong>ironie du titre<\u002Fstrong> \"mon père\" maintenu tout en le menaçant.\n- <strong>« un domestique… s'élança sur moi sans balancer »<\u002Fstrong> → <strong>coup de théâtre narratif<\u002Fstrong> : l'obstacle surgit à la dernière seconde.<\u002Fp>\n<blockquote>\n<p><em>Bilan : tension dramatique maximale, Des Grieux impassible.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — le meurtre et l'ironie<\u002Fstrong>\n- <strong>« Je ne le marchandai point ; je lui lâchai le coup au milieu de la poitrine »<\u002Fstrong> → <strong>phrase brève<\u002Fstrong>, <strong>passé simple<\u002Fstrong> sec : le meurtre raconté <strong>sans émotion<\u002Fstrong>.\n- <strong>« Voilà de quoi vous êtes cause, mon père »<\u002Fstrong> → <strong>transfert de responsabilité<\u002Fstrong> : Des Grieux <strong>accuse<\u002Fstrong> sa victime.\n- <strong>« C'est votre faute, lui dis-je ; pourquoi me l'apportiez-vous chargé ? »<\u002Fstrong> → même logique avec Lescaut ; <strong>ironie<\u002Fstrong> de l'irresponsabilité totale.<\u002Fp>\n<blockquote>\n<p><em>Bilan : violence froide et déni de culpabilité — un anti-héros fascinant.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> la scène révèle un Des Grieux capable de <strong>violence froide<\u002Fstrong> et de <strong>cynisme<\u002Fstrong> dès qu'il s'agit de Manon. La \"liberté\" qu'il invoque est une <strong>passion déguisée en idéal<\u002Fstrong>. Prévost construit un <strong>personnage en marge<\u002Fstrong>, à la frontière de la victime et du criminel. <strong>Ouverture :<\u002Fstrong> ce héros qui place sa passion au-dessus de la loi morale annonce les héros romantiques ; on peut le confronter au \"Avis de l'auteur\" (texte 9), où Prévost prétend pourtant faire œuvre <strong>morale<\u002Fstrong>. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« Je ne le marchandai point ; je lui lâchai le coup au milieu de la poitrine. »<\u002Fem>\n« Deux <strong>propositions indépendantes juxtaposées<\u002Fstrong> par le point-virgule. La première est de <strong>forme négative<\u002Fstrong> : \"ne… point\", forme <strong>soutenue/classique<\u002Fstrong> de \"ne… pas\", négation <strong>totale<\u002Fstrong> ; \"le\" est un <strong>pronom personnel COD<\u002Fstrong>. La seconde est <strong>affirmative<\u002Fstrong> : \"lui\" est un pronom personnel <strong>COI<\u002Fstrong> (= à lui), \"le coup\" le <strong>COD<\u002Fstrong>. »<\u002Fp>\n<\u002Fblockquote>\n<h2>TEXTE 11 — Abbé Prévost, <em>Manon Lescaut<\u002Fem> (1731), Deuxième partie — la mort de Manon<\u002Fh2>\n<blockquote>\n<p><strong>Introduction<\u002Fstrong> — « Dans ce passage de la deuxième partie, Des Grieux raconte, des années plus tard, la mort de Manon dans le désert américain, après leur fuite. La douleur rend le récit presque impossible. <strong>Nous nous demanderons comment Prévost traduit l'impossibilité de dire le deuil et de survivre à la mort de l'être aimé.<\u002Fstrong> Trois mouvements : l'aveu d'impuissance du narrateur ; la mort de Manon (ellipse centrale) ; la survie comme punition. »<\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 1 — l'impossibilité du récit<\u002Fstrong>\n- <strong>« Pardonnez, si j'achève en peu de mots un récit qui me tue »<\u002Fstrong> → <strong>apostrophe au lecteur<\u002Fstrong> + <strong>métaphore<\u002Fstrong> : le récit lui-même <strong>tue<\u002Fstrong> le narrateur.\n- <strong>« un malheur qui n'eut jamais d'exemple »<\u002Fstrong> → <strong>superlatif absolu<\u002Fstrong> : une douleur unique, incomparable.\n- <strong>« mon âme semble reculer d'horreur, chaque fois que j'entreprends de l'exprimer »<\u002Fstrong> → <strong>paradoxe<\u002Fstrong> : l'âme résiste à sa propre expression ; la douleur est <strong>indicible<\u002Fstrong>.<\u002Fp>\n<blockquote>\n<p><em>Bilan : la narration est elle-même une souffrance (métalepse pathétique).<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 2 — la mort de Manon (l'ellipse)<\u002Fstrong>\n- <strong>« Je croyais ma chère maîtresse endormie »<\u002Fstrong> → <strong>ironie tragique<\u002Fstrong> : il confond sommeil et mort ; l'amour aveugle jusqu'au bout.\n- <strong>« en touchant ses mains, qu'elle les avait froides et tremblantes »<\u002Fstrong> → <strong>détail physique<\u002Fstrong> : la mort passe par le <strong>toucher<\u002Fstrong>, dimension sensorielle pathétique.\n- <strong>« Je la perdis ; je reçus d'elle des marques d'amour, au moment même qu'elle expirait »<\u002Fstrong> → <strong>phrase brève<\u002Fstrong> + <strong>ellipse massive<\u002Fstrong> + <strong>antithèse<\u002Fstrong> amour/mort : la mort tient en une phrase — l'<strong>ellipse dit l'indicible<\u002Fstrong>.\n- <strong>« C'est tout ce que j'ai la force de vous apprendre »<\u002Fstrong> → <strong>aveu d'épuisement<\u002Fstrong> : le récit s'arrête.<\u002Fp>\n<blockquote>\n<p><em>Bilan : la mort est dite par le silence, l'ellipse et le détail sensoriel.<\u002Fem><\u002Fp>\n<\u002Fblockquote>\n<p><strong>Mouvement 3 — la survie comme punition<\u002Fstrong>\n- <strong>« Mon âme ne suivit pas la sienne »<\u002Fstrong> → <strong>regret<\u002Fstrong> de n'être pas mort : la survie est vécue comme trahison.\n- <strong>« Le Ciel ne me trouva point, sans doute, assez rigoureusement puni »<\u002Fstrong> → <strong>registre religieux<\u002Fstrong> : la survie = <strong>punition divine<\u002Fstrong> (cadre moral chrétien).\n- <strong>« Je renonce volontairement à la mener jamais plus heureuse »<\u002Fstrong> → <strong>vœu de malheur<\u002Fstrong> : il choisit la fidélité au deuil.<\u002Fp>\n<blockquote>\n<p><em>Bilan : survivre est une condamnation — l'amour absolu transcende la mort.<\u002Fem><\u002Fp>\n<p><strong>Conclusion<\u002Fstrong> — « <strong>Réponse :<\u002Fstrong> Prévost crée une <strong>rhétorique pathétique<\u002Fstrong> où la mort de Manon, décrite en une seule phrase, semble <strong>interdire les mots<\u002Fstrong>. Des Grieux est un héros <strong>romantique avant l'heure<\u002Fstrong> : sa survie est une peine, son amour transcende la mort. <strong>Ouverture :<\u002Fstrong> cet indicible du deuil rejoint l'indicible du tropisme chez Sarraute, et l'ellipse pudique trouvera de nombreux héritiers dans le roman moderne. »<\u002Fp>\n<p><strong>Question de grammaire<\u002Fstrong> — <em>« je n'osais pousser le moindre souffle, dans la crainte de troubler son sommeil. »<\u002Fem>\n« <strong>Forme négative<\u002Fstrong> : ici le \"ne\" est employé <strong>seul<\u002Fstrong> (sans \"pas\"), tournure <strong>littéraire/soutenue<\u00
