rt contre la chaîne.", "Lien direct avec La Boétie : la servitude se paie de la dignité."]}, "t15": {"work": "laboetie", "num": 15, "title": "Discours de la servitude volontaire (l'habitude)", "author": "Étienne de La Boétie", "date": "1574", "copyrighted": false, "role": "La première cause de la servitude : l'accoutumance", "full": "Disons donc que sont naturelles à l'homme toutes les choses auxquelles il s'éduque et s'accoutume ; mais ce vers quoi la nature simple et non altérée l'appelle, cela seul lui reste inné. Ainsi la première raison de la servitude volontaire, c'est l'habitude. Il en va ainsi des plus braves chevaux à qui l'on a coupé la queue qui au début mordent leur frein, puis s'en jouent, et, là où naguère ils ruaient contre la selle, se parent maintenant sous le harnais, et, tout fiers, se pavanent sous l'armure. Les hommes disent qu'ils ont toujours été sujets, que leurs pères ont ainsi vécu. Ils pensent qu'ils sont tenus d'endurer le mal et se laissent persuader par l'exemple.\n\nIl s'en trouve toujours quelques-uns, mieux nés que les autres, qui sentent le poids du joug et ne peuvent se retenir de le secouer ; qui ne se soumettent jamais à la sujétion. Ce sont volontiers ceux-là qui, ayant l'entendement net et l'esprit clairvoyant, ne se contentent pas, comme la grossière populace, de voir ce qui est à leurs pieds, mais se remémorent le passé pour juger de l'avenir et mesurer le présent. Ce sont ceux qui, ayant d'eux-mêmes la tête bien faite, l'ont encore perfectionnée par l'étude et le savoir.\n\nLe grand Turc a bien compris que les livres et la pensée donnent, plus que tout autre chose, aux hommes le sens et l'entendement propices à se reconnaître et à haïr la tyrannie. Je veux dire qu'il a sur ses terres peu de gens savants et n'en demande pas.", "annot": [{"p": "la première raison de la servitude volontaire, c'est l'habitude", "proc": "Présentatif / thèse explicite", "interp": "La cause majeure est nommée : l'accoutumance. On sert parce qu'on a toujours servi."}, {"p": "des plus braves chevaux à qui l'on a coupé la queue", "proc": "Comparaison filée (le dressage)", "interp": "Image fameuse : même les plus fiers se laissent dresser. La servitude se construit par habituation progressive."}, {"p": "se pavanent sous l'armure", "proc": "Ironie / personnification", "interp": "Le comble : les dressés sont « fiers » de leur servitude. Critique de ceux qui s'enorgueillissent de leur soumission."}, {"p": "qu'ils ont toujours été sujets, que leurs pères ont ainsi vécu", "proc": "Discours rapporté / argument d'autorité dénoncé", "interp": "La tradition tient lieu de raison : l'habitude se transmet et se justifie d'elle-même."}, {"p": "mieux nés que les autres", "proc": "Distinction / éloge des esprits libres", "interp": "Quelques-uns échappent à l'accoutumance : ceux qui pensent. Espoir humaniste."}, {"p": "se remémorent le passé pour juger de l'avenir", "proc": "Parallélisme temporel", "interp": "La mémoire de l'histoire entretient la liberté : programme du parcours (entretenir la liberté par le savoir)."}, {"p": "perfectionnée par l'étude et le savoir", "proc": "Éloge de l'instruction", "interp": "La liberté s'entretient par l'éducation : thèse humaniste centrale."}, {"p": "les livres et la pensée donnent, plus que tout autre chose", "proc": "Argument par l'exemple (le « grand Turc »)", "interp": "Les tyrans craignent les savants : preuve a contrario que le savoir libère."}], "retenir": ["Texte clé sur les causes : habitude + savoir.", "Citation : « la première raison de la servitude volontaire, c'est l'habitude »."]}, "t16": {"work": "laboetie", "num": 16, "title": "Discours de la servitude volontaire (la poésie et la liberté)", "author": "Étienne de La Boétie", "date": "1574", "copyrighted": false, "role": "L'écriture humaniste comme acte de liberté", "full": "Quoi qu'il en soit, en ce qui me concerne, je veux bien y croire, puisque ni nous ni nos ancêtres n'avons eu jusqu'ici l'occasion de ne pas y croire, ayant toujours eu des rois si bons en temps de paix et si vaillants en la guerre, que même en naissant rois, ils semblent avoir été non pas conçus comme les autres par la nature, mais choisis par Dieu tout-puissant, avant leur naissance, pour le gouvernement et la conservation de ce royaume.\n\nEt en admettant que cela ne soit pas le cas, même ainsi je ne voudrais pas pour autant entrer en lice pour débattre du fondement de notre histoire, ni l'examiner si profondément, afin de ne pas gâter ce beau sujet où pourra fort bien s'escrimer notre poésie française, qui n'est pas accoutrée d'ornements, mais comme il semble, refaite toute à neuf pour notre Ronsard, notre Baïf, notre Du Bellay, qui en cela font tant progresser notre langue que j'ose espérer que bientôt les Grecs ni les Latins n'auront rien à nous envier à ce sujet, sinon peut-être le droit d'aînesse.\n\nAssurément je ferais grand tort à notre rime (j'use volontiers de ce mot qui ne me déplaît point car, quoique plusieurs l'aient rendu purement mécanique, je vois assez de gens qui sont prêts à lui redonner ses lettres de noblesse). J'entends la portée, je connais l'esprit aigu, je sais la grâce de ce poète.", "annot": [{"p": "je veux bien y croire", "proc": "Ironie / fausse naïveté", "interp": "La Boétie feint d'adhérer à la fiction du roi choisi par Dieu : ironie prudente qui laisse percer le doute critique."}, {"p": "choisis par Dieu tout-puissant, avant leur naissance", "proc": "Critique implicite du droit divin", "interp": "En rapportant cette croyance, il en souligne le caractère construit : la légitimité du tyran est un mythe entretenu."}, {"p": "je ne voudrais pas pour autant entrer en lice", "proc": "Prétérition / prudence", "interp": "Il évite frontalement la question politique brûlante : stratégie de l'humaniste sous surveillance."}, {"p": "notre poésie française", "proc": "Éloge de la langue nationale", "interp": "La défense de la langue française rejoint la défense de la liberté : un peuple qui cultive sa langue cultive son esprit."}, {"p": "notre Ronsard, notre Baïf, notre Du Bellay", "proc": "Énumération / hommage à la Pléiade", "interp": "La Boétie s'associe au projet de « Défense et illustration de la langue française » : la création littéraire est un acte de liberté."}, {"p": "les Grecs ni les Latins n'auront rien à nous envier", "proc": "Comparaison / fierté humaniste", "interp": "Égaler les Anciens : ambition de la Renaissance. La culture comme émancipation collective."}, {"p": "lui redonner ses lettres de noblesse", "proc": "Métaphore", "interp": "Rendre sa dignité à la « rime » : l'écriture libre s'oppose à la mécanique servile, comme l'homme libre au servile."}], "retenir": ["Texte sur l'écriture comme liberté : éloge de la Pléiade et de la langue française.", "Montre l'ironie prudente de l'humaniste face au pouvoir."]}, "t5": {"work": "sarraute", "num": 5, "title": "Pour un oui ou pour un non — l'ouverture", "author": "Nathalie Sarraute", "date": "1982", "copyrighted": true, "role": "L'entrée dans la pièce : un malaise sans objet", "editable": true, "situ": "Début de la pièce. H1 vient interroger H2 sur l'éloignement qu'il ressent. À travers des détails ordinaires, Sarraute montre comment une relation se dérègle.", "mouvements": [{"title": "La demande inquiète de H1", "lines": "de « Écoute, je voulais te demander » à « Qu'est-ce que tu as contre moi ? »", "analyses": [{"cite": "je voudrais savoir… que s'est-il passé ?", "proc": "Interrogation directe + points de suspension", "interp": "H1 cherche un événement, une cause rationnelle. Les points de suspension disent l'embarras : le malaise n'a pas de mots."}, {"cite": "Qu'est-ce que tu as contre moi ?", "proc": "Question fermée", "interp": "H1 suppose un grief concret : il pense le conflit en termes logiques, ce que la pièce va démentir."}]}, {"title": "L'esquive de H2", "lines": "de « Mais rien… Pourquoi ? » à « j'ai peur de déranger »", "analyses": [{"cite": "Mais rien… Pourquoi ?", "proc": "Négation + question / dénégation", "interp": "H2 nie et renvoie la question : posture de fuite. Le « rien » central du titre apparaît déjà."}, {"cite": "j'ai peur de déranger", "proc": "Litote / aveu détourné", "interp": "H2 masque le malaise sous une explication anodine : le tropisme reste sous la surface des mots."}]}, {"title": "La mémoire de l'amitié", "lines": "évocation de la mère, du passé commun", "analyses": [{"cite": "depuis tant d'années", "proc": "Complément de temps / hyperbole affective", "interp": "L'ancienneté du lien rend la distance d'autant plus douloureuse : l'amitié-miroir."}, {"cite": "pauvre maman… Elle t'aimait bien", "proc": "Discours rapporté / pathétique", "interp": "La figure maternelle transforme l'amitié en fraternité symbolique ; chaleur du souvenir qui contraste avec le froid présent."}]}, {"title": "Le point de bascule : l'aveu de la distance", "lines": "de « je te connais trop bien » à « Rien qu'on puisse dire »", "analyses": [{"cite": "je te connais trop bien", "proc": "Adverbe d'intensité", "interp": "La connaissance intime devient source de souffrance : on perçoit la moindre faille."}, {"cite": "c'est plus fort que moi", "proc": "Tournure impersonnelle", "interp": "H2 subit un mouvement qu'il ne maîtrise pas : c'est la définition même du tropisme."}, {"cite": "Rien… vraiment rien… Rien qu'on puisse dire", "proc": "Gradation par répétition + relative restrictive", "interp": "L'objet du malaise est indicible. Tout le drame tient dans ce « rien » verbalement insaisissable."}]}], "retenir": ["Texte d'ouverture : opposition entre la logique de H1 (chercher une cause) et l'indicible de H2.", "Le « rien » est le cœur du tropisme et du titre."]}, "t7": {"work": "sarraute", "num": 7, "title": "Pour un oui ou pour un non — « sables mouvants » / « Oui. Ou non. »", "author": "Nathalie Sarraute", "date": "1982", "copyrighted": true, "role": "La révélation de l'incompatibilité et la fausse réconciliation", "editable": true, "situ": "Plus loin dans la pièce. Les deux amis tentent de nommer ce qui les sépare, envisagent de « rompre », et la pièce se referme sur l'opposition de deux mots.", "mouvements": [{"title": "Deux espaces intérieurs incompatibles", "lines": "les métaphores de H1 et de H2", "analyses": [{"cite": "des sables mouvants où l'on s'enfonce", "proc": "Métaphore (monde de H2 vu par H1)", "interp": "H1 éprouve chez H2 l'instabilité, la perte de repères : il a besoin de « stable. Solide. »"}, {"cite": "c'est comme de la claustrophobie", "proc": "Comparaison (monde de H1 vu par H2)", "interp": "Symétrie parfaite : ce qui rassure l'un étouffe l'autre. Deux sensibilités opposées, irréconciliables."}, {"cite": "reprendre vie… cette pulsation, un pouls", "proc": "Métaphore organique", "interp": "H2 a besoin de vibration, de vie sensible : il incarne l'âme poétique face au confort bourgeois de H1."}]}, {"title": "La tentation de rompre et le regard des autres", "lines": "l'idée de « demande », le tribunal imaginaire", "analyses": [{"cite": "Ce serait tellement plus sain", "proc": "Stichomythie / phrases complétées à deux", "interp": "Ironie : ils s'accordent parfaitement… pour se séparer. La connivence persiste dans la rupture."}, {"cite": "J'ai besoin qu'on m'autorise", "proc": "Aveu / dépendance au regard social", "interp": "La rupture amicale est jugée scandaleuse : la société (le « on ») pèse sur l'intime."}, {"cite": "rien d'autre nulle part que les signes d'une amitié parfaite", "proc": "Discours rapporté du « tribunal »", "interp": "Vu de l'extérieur, leur amitié est « parfaite » : le drame est invisible, intérieur — c'est tout l'enjeu des tropismes."}]}, {"title": "La clausule : l'opposition réduite à deux mots", "lines": "de « Pour un oui… ou pour un non ? » à « Non ! »", "analyses": [{"cite": "Pour un oui… ou pour un non ?", "proc": "Reprise du titre / question", "interp": "Le titre devient réplique : la pièce se referme sur son propre motif, la futilité érigée en gouffre."}, {"cite": "Ce n'est pourtant pas la même chose", "proc": "Antithèse minimale", "interp": "Tout se joue dans l'écart infime entre « oui » et « non » : l'opposition irréductible des deux êtres."}, {"cite": "Oui. Ou non.", "proc": "Ponctuation expressive / phrases nominales", "interp": "Le langage réduit à l'os : deux mots, deux mondes. Le rideau tombe sur la division, non sur sa résolution."}]}], "retenir": ["Texte du dénouement : la dispute ne se résout pas, elle révèle l'incompatibilité.", "La clausule « Oui. Ou non. » condense tout le sens de la pièce."]}, "t8": {"work": "sarraute", "num": 8, "title": "Pour un oui ou pour un non — la « souricière » et « c'est biiien… ça »", "author": "Nathalie Sarraute", "date": "1982", "copyrighted": true, "role": "Le récit de l'origine de la dispute, devant les témoins", "editable": true, "situ": "H2 raconte, devant H3 et F, l'épisode déclencheur : H1 l'avait félicité d'un ton qui lui a paru condescendant. Les témoins ne comprennent pas.", "mouvements": [{"title": "H2, centre d'un spectacle comique", "lines": "l'arrivée des voisins, les rires", "analyses": [{"cite": "Quelle souricière, dis-nous…", "proc": "Métaphore (le piège)", "interp": "H2 a vécu la félicitation comme un piège tendu : la situation banale est dramatisée, ce qui amuse H1."}, {"cite": "je trouve ça gentil…", "proc": "Réplique de F / point de vue extérieur", "interp": "Le bon sens des témoins souligne la disproportion : pour eux, rien de grave. Effet comique."}]}, {"title": "Le récit de l'humiliation intime", "lines": "H2 décrit comment il a « joué le jeu »", "analyses": [{"cite": "je me suis installé tout au fond de la cage", "proc": "Métaphore filée (la cage)", "interp": "H2 s'accuse d'avoir accepté les règles d'un monde (le confort, la « place ») qui n'est pas le sien : honte de soi."}, {"cite": "Il m'a tenu dans le creux de sa main", "proc": "Métaphore de la domination", "interp": "H2 se sent réduit, jaugé, dominé par H1 : la félicitation est vécue comme une mise en position d'infériorité."}]}, {"title": "Le mot qui blesse : « c'est biiien… ça »", "lines": "la citation du ton de H1", "analyses": [{"cite": "c'est biiien… ça… Oh mais qu'est-ce que vous pouvez comprendre", "proc": "Didascalie interne de prononciation + apostrophe", "interp": "L'étirement et le suspens portent toute la condescendance perçue. Le sens est dans le ton, non dans les mots — définition du tropisme."}, {"cite": "Pas grand chose, en effet.", "proc": "Réplique de H3 / litote", "interp": "Les témoins concluent à l'insignifiance : la pièce assume sa dimension comique tout en validant le ressenti de H2."}]}], "retenir": ["Texte qui explicite l'origine de la dispute : un simple ton perçu comme condescendant.", "Comique (le jugement des témoins) ET sérieux (l'humiliation intime de H2) coexistent."]}, "t2": {"work": "dorion", "num": 2, "title": "Mes forêts — « L'aile »", "author": "Hélène Dorion", "date": "2021", "copyrighted": true, "role": "Section « L'écorce incertaine » : la beauté blessée", "editable": true, "situ": "Poème bref de la première section. La beauté (l'aile) est saisie par un animal et emportée « à l'intérieur du poème ».", "mouvements": [{"title": "L'élévation de la beauté", "lines": "vers 1-4", "analyses": [{"cite": "très haute / de la beauté / perce le brouillard de vivre", "proc": "Métaphore + enjambements", "interp": "La beauté s'élève au-dessus de l'opacité de l'existence (« le brouillard de vivre ») : aspiration à la transcendance."}]}, {"title": "La chute et la violence de la nature", "lines": "vers 5-9", "analyses": [{"cite": "l'animal saisit l'aile / qui gît au sol", "proc": "Personnification / scène de prédation", "interp": "La nature n'est pas qu'idyllique : elle est aussi violence. La beauté retombe, blessée."}, {"cite": "comme une mémoire difforme / de l'histoire", "proc": "Comparaison", "interp": "La beauté abîmée devient trace d'une mémoire collective blessée : l'intime rejoint l'Histoire."}]}, {"title": "Le refuge du poème et la marche intérieure", "lines": "vers 10-fin", "analyses": [{"cite": "l'emporte loin / à l'intérieur du poème", "proc": "Métaphore spatiale", "interp": "Le poème devient un espace, un refuge où la beauté blessée est recueillie : fonction réparatrice de la poésie."}, {"cite": "la forêt rêve-t-elle / alors que j'avance / à petits pas", "proc": "Personnification + question", "interp": "Confusion entre la conscience de la poétesse et la forêt : la nature rêve comme un sujet. Marche = progression intérieure."}, {"cite": "de l'autre côté de la nuit", "proc": "Métaphore (récurrente dans le recueil)", "interp": "La nuit comme épreuve à traverser, promesse d'un autre versant : motif du passage et de l'espoir."}]}], "retenir": ["Poème emblématique du paradoxe de la nature : beauté ET violence.", "La poésie comme espace réparateur (« à l'intérieur du poème »)."]}, "t3": {"work": "dorion", "num": 3, "title": "Mes forêts — « Il fait un temps de foudre et de lambeaux »", "author": "Hélène Dorion", "date": "2021", "copyrighted": true, "role": "Section « L'onde du chaos » : le monde menacé et numérique", "editable": true, "situ": "Poème de la troisième section. Le « temps » météorologique devient métaphore du chaos du monde contemporain.", "mouvements": [{"title": "Un temps de catastrophe intérieure", "lines": "début", "analyses": [{"cite": "Il fait un temps de foudre et de lambeaux", "proc": "Tournure impersonnelle « il fait un temps de » + métaphore", "interp": "Le temps météorologique figure un état du monde et de l'âme : violence, déchirure. Structure anaphorique du recueil."}, {"cite": "d'arbres abattus / au-dedans de soi", "proc": "Métaphore / intériorisation", "interp": "La dévastation extérieure est aussi intérieure : nature et intime confondus dans la blessure."}]}, {"title": "Le chaos collectif et numérique", "lines": "milieu", "analyses": [{"cite": "guerres famines tristes duretés", "proc": "Accumulation asyndétique", "interp": "L'absence de ponctuation et de liaison mime l'avalanche du chaos contemporain : violence de l'Histoire."}, {"cite": "sur l'écran d'aujourd'hui", "proc": "Ancrage dans la modernité", "interp": "Le monde n'est plus vécu mais médié par l'écran : critique de notre rapport numérique au réel."}, {"cite": "des chiffres pour ne rien dire", "proc": "Paradoxe / critique du langage chiffré", "interp": "Opposition entre la langue utilitaire (chiffres, acronymes) et le sens : le monde « illyrique »."}, {"cite": "comme pib / nip fmi", "proc": "Accumulation d'acronymes / agglutination", "interp": "La langue déshumanisée des sigles : éclatement et vide de sens dénoncés par la poésie."}]}, {"title": "Le repli et le secret de la nature", "lines": "fin", "analyses": [{"cite": "s'enfermer / dans nos maisons de forêt", "proc": "Métaphore de l'abri", "interp": "La forêt comme refuge face au chaos : mais un refuge fragile, traversé par « le bruit secret des nuages »."}, {"cite": "de l'autre côté de la nuit", "proc": "Reprise / motif d'espoir", "interp": "Même dans le chaos, la nuit ouvre sur un autre versant : la promesse n'est jamais tout à fait éteinte."}]}], "retenir": ["Texte central pour la critique du monde numérique (« illyrique »).", "La structure « Il fait un temps de » lie météo, monde et intime."]}, "t4": {"work": "dorion", "num": 4, "title": "Mes forêts — « Avant la nuit » (v.73-98)", "author": "Hélène Dorion", "date": "2021", "copyrighted": true, "role": "Section « Le bruissement du temps » : la traversée des forêts littéraires", "editable": true, "situ": "Fin du recueil. La promenade en forêt devient un parcours à travers les grandes forêts de la littérature, vers la connaissance de soi.", "mouvements": [{"title": "Le rêve et la mémoire littéraire", "lines": "début", "analyses": [{"cite": "du haut des falaises de Rilke / dans la forêt de Dante", "proc": "Énumération de références littéraires", "interp": "La nature devient une bibliothèque : Rilke, Dante, Walden (Thoreau), Hopkins… La forêt intime se nourrit de la culture."}, {"cite": "on eton. Le narrateur erre dans Paris et croise une jeune femme étrange, en marge, qui le fascine.", "mouvements": [{"title": "L'errance et le désœuvrement", "lines": "début", "analyses": [{"cite": "un de ces après-midi tout à fait désœuvrés et très mornes", "proc": "Adjectifs dépréciatifs / ennui", "interp": "Le narrateur est lui-même en marge du monde productif : disponibilité à l'étrange, posture surréaliste."}, {"cite": "sans but je poursuivais ma route", "proc": "Hasard / dérive", "interp": "L'errance sans but ouvre à la rencontre : le hasard objectif cher aux surréalistes."}]}, {"title": "La foule conforme", "lines": "milieu", "analyses": [{"cite": "ce n'étaient pas encore ceux-là qu'on trouverait prêts à faire la Révolution", "proc": "Jugement / ironie", "interp": "La masse conforme s'oppose à la singularité à venir : critique du conformisme, valorisation de la marge."}]}, {"title": "L'apparition de la femme en marge", "lines": "fin", "analyses": [{"cite": "une jeune femme très pauvrement vêtue", "proc": "Portrait / marginalité sociale", "interp": "Nadja est en marge par sa pauvreté et son allure : figure du personnage marginal, comme Manon à sa façon."}, {"cite": "Elle va la tête haute, contrairement à tous les autres passants", "proc": "Antithèse", "interp": "Sa singularité éclate dans la foule : la marge est ici dignité et mystère, non déchéance."}, {"cite": "Je n'avais jamais vu de tels yeux", "proc": "Hyperbole / fascination", "interp": "La rencontre relève de l'éblouissement : le personnage en marge ouvre une autre perception du réel."}]}], "retenir": ["Point de comparaison avec Manon : le personnage en marge comme source de fascination romanesque.", "La marginalité, ici, est mystère et dignité plutôt que déchéance."]}}, "qcm": [{"q": "À quel courant littéraire Nathalie Sarraute est-elle rattachée ?", "options": ["Le Nouveau Roman", "Le Surréalisme", "Le Classicisme", "Le Naturalisme"], "answer": 0, "explain": "Sarraute est une figure du Nouveau Roman, qui s'intéresse aux mouvements intérieurs plutôt qu'à l'action.", "tag": "sarraute"}, {"q": "Que désignent les « tropismes » chez Sarraute ?", "options": ["Des figures de style", "Des mouvements intérieurs infimes et fugaces", "Des didascalies", "Des types de personnages"], "answer": 1, "explain": "Les tropismes sont ces mouvements infimes, presque imperceptibles, qui se cachent sous les mots des conversations banales.", "tag": "sarraute"}, {"q": "Quel est le parcours associé à Pour un oui ou pour un non ?", "options": ["Théâtre et dispute", "Crise personnelle, crise familiale", "Le théâtre, texte et représentation", "Maîtres et valets"], "answer": 0, "explain": "Le parcours est « Théâtre et dispute ».", "tag": "sarraute"}, {"q": "Quelle parole déclenche la dispute dans la pièce ?", "options": ["« Tu es un raté »", "« C'est biiien… ça »", "« Je ne t'aime plus »", "« Pour un oui ou pour un non »"], "answer": 1, "explain": "C'est l'intonation du « C'est biiien… ça », perçue comme condescendante, qui déclenche tout.", "tag": "sarraute"}, {"q": "En quoi la dispute de la pièce détourne-t-elle les conventions théâtrales ?", "options": ["Elle se dénoue par un mariage", "Elle a lieu hors scène", "Elle ne se dénoue pas, elle s'aggrave jusqu'au rideau", "Elle est résolue par un personnage extérieur"], "answer": 2, "explain": "Au lieu d'être un nœud que l'intrigue dénoue, la dispute est un état qui s'aggrave : la pièce se ferme sur son paroxysme.", "tag": "sarraute"}, {"q": "Que symbolise l'opposition « Oui. Ou non. » à la fin ?", "options": ["Une réconciliation", "L'opposition irréductible entre les deux êtres", "Un jeu de mots gratuit", "L'accord des deux amis"], "answer": 1, "explain": "La séparation de ces deux mots condense l'incompatibilité fondamentale entre H1 et H2.", "tag": "sarraute"}, {"q": "Quel type social H1 incarne-t-il ?", "options": ["L'artiste marginal", "La rationalité et le bonheur bourgeois", "Le révolté", "Le tyran"], "answer": 1, "explain": "H1 incarne la <script>

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},

};

const VIEWS=[

/* THEME */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);store.set('theme',t);
  const b=$('#themebtn');if(b)b.textContent=t==='dark'?'☀':'☾';}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');}

/* NAV */
function buildNav(){
  const nav=$('#tabs');
  nav.innerHTML=VIEWS.map(v=>`<button class="tab${v.soon?' soon':''}" data-v="${v.id}">${esc(v.label)}${v.soon?' <span class="badge">bientôt</span>':''}</button>`).join('');
  $$('.tab',nav).forEach(b=>b.onclick=()=>{go(b.dataset.v);$('.nav').classList.remove('menuopen');});
}
function setActiveTab(id){$$('.tab').forEach(b=>{const on=b.dataset.v===id;b.classList.toggle('active',on);
  if(on&&innerWidth<=760){try{b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}catch(e){}}});}
function go(id){location.hash=id;}
function route(){
  const id=(location.hash||'#accueil').slice(1);
  const v=VIEWS.find(x=>x.id===id)||VIEWS[0];
  setActiveTab(v.id);
  const app=$('#app');app.classList.remove('active');void app.offsetWidth;
  if(v.id==='accueil')renderAccueil();
  else if(v.id==='methode')renderMethode();
  else if(v.work)renderWork(v.id);
  else if(v.id==='citations')renderCitations();
  else if(v.id==='qcm')renderQCM();
  else if(v.id==='perso')renderPerso();
  else if(v.id==='maths')renderSoon('maths');
  else if(v.id==='oral')renderSoon('oral');
  app.classList.add('active');window.scrollTo({top:0,behavior:'instant'});
}

/* COUNTDOWN */
let cdTimer=null;
function startCountdown(){
  const el=$('#countdown');if(!el)return;
  if(cdTimer)clearInterval(cdTimer);
  const tick=()=>{
    const now=new Date(),target=new Date(DATA.examDate);
    let d=Math.max(0,target-now);
    const days=Math.floor(d/864e5);d-=days*864e5;
    const h=Math.floor(d/36e5);d-=h*36e5;
    const m=Math.floor(d/6e4);d-=m*6e4;const s=Math.floor(d/1e3);
    el.innerHTML=[[days,'jours'],[h,'heures'],[m,'min'],[s,'sec']]
      .map(x=>`<div class="box"><span class="num">${x[0]}</span><span class="lab">${x[1]}</span></div>`).join('');
  };
  tick();cdTimer=setInterval(tick,1000);
}

     <div class="btnrow"><button class="btn" data-go="methode">Découvrir la méthode</button>
       <button class="btn ghost" style="color:#F4ECDC;border-color:rgba(255,255,255,.4)" data-go="qcm">S'entraîner aux QCM</button></div>

const TASKS=[

function renderPerso(){

  startCountdown();

/* METHODE */
function renderMethode(){
  const m=DATA.methode, c=m.commentaire;
  const steps=(arr)=>arr.map((x,i)=>`<div class="movhead"><span class="n">${i+1}</span>${esc(x[0])}</div><p class="prose" style="margin-left:36px">${esc(x[1])}</p>`).join('');

      <div class="callout tip" style="margin-top:16px">Conseil : choisir l'exercice (commentaire ou dissertation) où l'on se sent le plus solide, et le décider <b>avant</b> l'épreuve, pas le jour J devant la copie.</div>`,
    diss:()=>`

      <h2 style="margin:28px 0 10px">Gérer les 4 heures</h2><div class="card">${timing}</div>
      <h2 style="margin:28px 0 10px">Ce qui est noté</h2><div class="card"><ul class="prose" style="padding-left:18px">${list(m.diss_criteres)}</ul></div>`,
    comm:()=>`
      <div class="callout"><p class="prose" style="margin:0">${c.intro_concept}</p></div>
      <h2 style="margin:22px 0 10px">Préparer le commentaire (au brouillon)</h2>
      <div class="card">${steps(c.prepa)}</div>
      <h2 style="margin:24px 0 10px">L'introduction</h2><div class="card">${steps(c.intro)}</div>

      <div class="grid g3">${procedes}</div>
      <div class="callout tip" style="margin-top:16px">Pour chaque procédé repéré : <b>cite</b> → <b>nomme</b> → <b>interprète l'effet</b>. Les textes des œuvres sont déjà annotés sur ce modèle : ouvre-les pour t'entraîner à reconnaître les procédés.</div>`,
    gram:()=>`<div class="callout tip">Utile surtout pour la <b>question de grammaire</b> de l'oral. À survoler.</div>

function sujetBlock(s,i){
  const axes=s.plan.map((a,j)=>`<div class="movhead"><span class="n">${['I','II','III'][j]||j+1}</span>${esc(a.a)}</div>
     <ul class="prose" style="margin-left:36px;padding-left:18px">${a.s.map(x=>`<li style="margin:5px 0">${esc(x)}</li>`).join('')}</ul>`).join('');
  return `<div class="card" style="margin-bottom:18px">
    <span class="badge">Plan ${esc(s.type)}</span>
    <h3 style="margin:10px 0 4px">Sujet ${i+1} — « ${esc(s.q)} »</h3>
    ${axes}
    <p class="mini" style="margin-top:10px">Pour s'entraîner : rédiger seulement l'introduction et la conclusion (15 min), garder les axes en plan détaillé.</p>
  </div>`;
}

/* TEXT BLOCK */
let ANNOT=[];
function textBlock(tid){
  const t=DATA.texts[tid];if(!t)return '';
  let inner='';
  if(!t.copyrighted && t.full){
    let html=esc(t.full);
    (t.annot||[]).forEach(a=>{
      const idx=ANNOT.length;ANNOT.push({proc:a.proc,interp:a.interp});
      const ph=esc(a.p);
      const pos=html.indexOf(ph);
      if(pos>=0){html=html.slice(0,pos)+`<mark class="cite${a.clay?' clay':''}" data-a="${idx}">`+ph+`</mark>`+html.slice(pos+ph.length);}
    });
    inner=`<div class="note-tag">Texte intégral · survole / touche le surligné pour l'explication</div>
      <div class="literary">${html}</div>`;
  } else {
    const movs=(t.mouvements||[]).map((mv,k)=>`<div class="movhead"><span class="n">${k+1}</span>${esc(mv.title)}</div>
      <p class="mini" style="margin:0 0 6px 36px">${esc(mv.lines)}</p>
      <div style="margin-left:36px">${mv.analyses.map(a=>`<div class="card" style="margin:8px 0;padding:14px 16px">
         <div class="q" style="font-family:var(--font-display);font-size:1.05rem">« ${esc(a.cite)} »</div>
         <div class="meta" style="font-family:var(--font-ui);font-size:.85rem;margin-top:5px"><b style="color:var(--clay)">${esc(a.proc)}</b> — ${esc(a.interp)}</div></div>`).join('')}</div>`).join('');
    inner=`<div class="callout warn"><b>Texte sous droits</b> — analyse linéaire complète ci-dessous. Colle ton texte dans la zone pour le réviser à côté.</div>
      ${t.situ?`<p class="prose"><b>Situation :</b> ${esc(t.situ)}</p>`:''}
      <div class="note-tag">Analyse par mouvements</div>${movs}
      <div class="note-tag" style="margin-top:14px">Ton texte (collé par toi, sauvegardé sur cet appareil)</div>
      <textarea class="paste" data-paste="${tid}" placeholder="Colle ici le texte distribué en classe…"></textarea>`;
  }
  const ret=(t.retenir||[]).map(r=>`<li style="margin:4px 0">${esc(r)}</li>`).join('');
  return `<details class="card" style="margin-bottom:14px">
    <summary style="cursor:pointer;font-family:var(--font-display);font-size:1.2rem;list-style:none">
      <span class="badge" style="margin-right:8px">Texte ${t.num}</span>${esc(t.title)}
      ${t.role?`<div class="mini" style="margin-top:4px">${esc(t.role)}</div>`:''}</summary>
    <div style="margin-top:14px">${inner}
      ${ret?`<div class="callout tip" style="margin-top:14px"><b>À retenir :</b><ul style="margin:6px 0 0;padding-left:18px">${ret}</ul></div>`:''}
    </div></details>`;
}
function bindPaste(){
  $$('[data-paste]').forEach(ta=>{const k='paste_'+ta.dataset.paste;ta.value=store.get(k,'');
    ta.oninput=()=>store.set(k,ta.value);});
}

/* TOOLTIP */
function initTooltip(){
  const pop=$('#pop');
  function showFor(el){
    const a=ANNOT[el.dataset.a];if(!a)return;
    pop.innerHTML=`<span class="pp">${esc(a.proc)}</span><span class="pi">${esc(a.interp)}</span>`;
    pop.classList.add('show');
    const r=el.getBoundingClientRect();pop.style.left='0px';pop.style.top='0px';
    const pr=pop.getBoundingClientRect();
    let left=r.left+r.width/2-pr.width/2;left=Math.max(10,Math.min(left,innerWidth-pr.width-10));
    let top=r.bottom+8;if(top+pr.height>innerHeight-10)top=r.top-pr.height-8;
    pop.style.left=left+'px';pop.style.top=top+'px';
  }
  function hide(){pop.classList.remove('show');$$('.cite.open').forEach(c=>c.classList.remove('open'));}
  document.addEventListener('mouseover',e=>{const c=e.target.closest('.cite');if(c)showFor(c);});
  document.addEventListener('mouseout',e=>{if(e.target.closest('.cite'))hide();});
  document.addEventListener('click',e=>{const c=e.target.closest('.cite');
    if(c){if(c.classList.contains('open')){hide();}else{hide();c.classList.add('open');showFor(c);}}
    else if(!e.target.closest('.pop'))hide();},true);
  addEventListener('scroll',hide,true);
}

/* CITATIONS */
let deck=[],di=0;
function buildDeck(filter){
  deck=[];Object.values(DATA.works).forEach(w=>{
    if(filter==='all'||filter===w.id)w.citations.forEach(c=>deck.push({...c,work:w.title,wid:w.id}));});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function renderCitations(){
  $('#app').innerHTML=`
    <div class="kicker">Mode récitation</div><h1 style="margin:.1em 0 .3em">Flashcards de citations</h1>
    <p class="prose">Récite à voix haute. Clique la carte pour révéler le procédé et l'interprétation.</p>
    <div class="btnrow">
      <select id="fcfilter" class="qcm-opt" style="width:auto;display:inline-block;margin:0">
        <option value="all">Toutes les œuvres</option>
        <option value="sarraute">Sarraute</option><option value="manon">Manon Lescaut</option>
        <option value="dorion">Mes forêts</option><option value="laboetie">La Boétie</option>
      </select>
      <button class="btn ghost" id="fcshuf">Mélanger</button>
      <span class="scorepill" id="fccount"></span>
    </div>
    <div class="flash" id="flash" style="margin-top:18px"><div class="inner">
      <div class="face front"><div class="q" id="fcfront"></div><div class="hintrow">clique pour retourner</div></div>
      <div class="face back"><div id="fcback"></div></div></div></div>
    <div class="btnrow"><button class="btn ghost" id="fcprev">← Précédente</button>
      <button class="btn" id="fcnext">Suivante →</button></div>`;
  const filterEl=$('#fcfilter');
  function load(){buildDeck(filterEl.value);di=0;render();}
  function render(){
    if(!deck.length)return;const c=deck[di];
    $('#flash').classList.remove('flip');
    $('#fcfront').innerHTML=`« ${esc(c.c)} »<div class="mini" style="margin-top:10px">${esc(c.work)}</div>`;
    $('#fcback').innerHTML=`<div class="note-tag">${esc(c.proc)}</div><p class="prose" style="margin-top:8px">${esc(c.interp)}</p>`;
    $('#fccount').textContent=`${di+1} / ${deck.length}`;
  }
  $('#flash').onclick=()=>$('#flash').classList.toggle('flip');
  $('#fcnext').onclick=()=>{di=(di+1)%deck.length;render();};
  $('#fcprev').onclick=()=>{di=(di-1+deck.length)%deck.length;render();};
  $('#fcshuf').onclick=()=>{shuffle(deck);di=0;render();};
  filterEl.onchange=load;load();
}

/* QCM */
let qPool=[],qCur=-1,qScore=0,qTotal=0,qAnswered=false;
function renderQCM(){
  $('#app').innerHTML=`
    <div class="kicker">Entraînement</div><h1 style="margin:.1em 0 .3em">QCM régénérables</h1>
    <p class="prose">Réponds, vérifie, puis « Question suivante ». Le bouton « Changer » remplace la question sans la compter.</p>
    <div class="btnrow">
      <select id="qfilter" class="qcm-opt" style="width:auto;display:inline-block;margin:0">
        <option value="all">Tout le programme</option>
        <option value="sarraute">Sarraute</option><option value="manon">Manon Lescaut</option>
        <option value="dorion">Mes forêts</option><option value="laboetie">La Boétie</option>
        <option value="methode">Méthode</option><option value="parcours">Parcours croisés</option>
      </select>
      <span class="scorepill" id="qscore">Score : 0 / 0</span>
      <button class="btn ghost" id="qreset">Remettre à zéro</button>
    </div>
    <div class="card" id="qcard" style="margin-top:18px"></div>
    <div class="btnrow">
      <button class="btn ghost" id="qchange">↻ Changer la question</button>
      <button class="btn" id="qnext">Question suivante →</button>
    </div>`;
  const filterEl=$('#qfilter');
  function buildPool(){qPool=DATA.qcm.filter(q=>filterEl.value==='all'||q.tag===filterEl.value);}
  function pick(){let n;if(qPool.length<=1){n=0;}else{do{n=Math.floor(Math.random()*qPool.length);}while(n===qCur);}qCur=n;qAnswered=false;draw();}
  function draw(){
    const q=qPool[qCur];if(!q){$('#qcard').innerHTML='<p>Aucune question.</p>';return;}
    $('#qcard').innerHTML=`<div class="note-tag">${esc(({sarraute:'Sarraute',manon:'Manon Lescaut',dorion:'Mes forêts',laboetie:'La Boétie',methode:'Méthode',parcours:'Parcours'})[q.tag]||'')}</div>
      <h3 style="margin:6px 0 14px">${esc(q.q)}</h3>
      <div id="qopts">${q.options.map((o,i)=>`<button class="qcm-opt" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join('')}</div>
      <div class="qcm-explain" id="qexp"></div>`;
    $$('#qopts .qcm-opt').forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.i),q));
  }
  function answer(i,q){
    if(qAnswered)return;qAnswered=true;qTotal++;if(i===q.answer)qScore++;
    $$('#qopts .qcm-opt').forEach(b=>{const bi=parseInt(b.dataset.i);
      if(bi===q.answer)b.classList.add('good');else if(bi===i)b.classList.add('bad');b.style.pointerEvents='none';});
    const ex=$('#qexp');ex.innerHTML=`<b>${i===q.answer?'✓ Correct.':'✗ Pas tout à fait.'}</b> ${esc(q.explain)}`;ex.classList.add('show');
    $('#qscore').textContent=`Score : ${qScore} / ${qTotal}`;
  }
  $('#qnext').onclick=()=>pick();
  $('#qchange').onclick=()=>pick();
  $('#qreset').onclick=()=>{qScore=0;qTotal=0;$('#qscore').textContent='Score : 0 / 0';pick();};
  filterEl.onchange=()=>{buildPool();qCur=-1;pick();};
  buildPool();$('#qscore').textContent=`Score : ${qScore} / ${qTotal}`;pick();
}

/* INIT */
function initNavBehaviour(){
  const nav=$('.nav');
  $('#menubtn').onclick=()=>{nav.classList.toggle('menuopen');if(nav.classList.contains('menuopen'))nav.classList.remove('hidden');};
  let lastY=window.scrollY||0;
  addEventListener('scroll',()=>{
    const y=window.scrollY||0;
    if(innerWidth>760||nav.classList.contains('menuopen')){nav.classList.remove('hidden');lastY=y;return;}
    if(y>lastY+6 && y>110)nav.classList.add('hidden');
    else if(y<lastY-6)nav.classList.remove('hidden');
    lastY=y;
  },{passive:true});
}
function init(){
  applyTheme(store.get('theme','light'));
  $('#themebtn').onclick=toggleTheme;
  buildNav();initTooltip();initNavBehaviour();
  addEventListener('hashchange',route);
  route();
}
document.addEventListener('DOMContentLoaded',init);
